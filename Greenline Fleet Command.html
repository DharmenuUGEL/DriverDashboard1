<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Greenline Fleet Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Greenline Fleet Command — layout: asphalt top bar with lane-marking line, left route rail, sticky filter bar, card grid.
   Palette: asphalt, Greenline green, road-marking amber, signal red. Type: Barlow Semi Condensed (signage) + IBM Plex Sans + Plex Mono. */
:root {
  --bg: #edf0ee; --surface: #ffffff; --surface-2: #f6f8f7; --ink: #14201b; --ink-2: #44554d; --muted: #75857d;
  --line: #dbe2de; --track: #e4e9e6; --axis: #b9c4be; --hover: rgba(11,122,85,.08); --shade: rgba(120,140,130,.12);
  --asphalt: #17201c; --asphalt-2: #222d28; --on-asphalt: #e9f0ec; --on-asphalt-2: #9fb0a7;
  --brand: #0b7a55; --brand-ink: #ffffff; --brand-soft: #dcf0e7; --amber: #f5b700;
  --good: #14804f; --good-bg: #dcf1e5; --bad: #cf3a33; --bad-bg: #fbe3e1; --warn: #b36a00; --warn-bg: #fdf0d3; --neutral: #5d6e66; --neutral-bg: #e8edea;
  --c1: #0b7a55; --c2: #3b6fb6; --c-spark: #0b7a55; --c-prev: #9aa8a1;
  --g-work: #1f9d6b; --g-breakdown: #d2403a; --g-tyre: #e39a1b; --g-permit: #7b61c4; --g-fuel: #2b9bb8; --g-nodriver: #5c7db8; --g-maint: #b8693a; --g-other: #8a9690;
  --shadow: 0 1px 2px rgba(20,32,27,.06), 0 4px 14px rgba(20,32,27,.05);
  --f-disp: 'Barlow Semi Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1411; --surface: #172019; --surface-2: #1c2620; --ink: #e8efeb; --ink-2: #aab9b1; --muted: #7f8f87;
  --line: #2a362f; --track: #25312a; --axis: #46554d; --hover: rgba(60,196,138,.12); --shade: rgba(160,180,170,.10);
  --asphalt: #0a0f0c; --asphalt-2: #151d18; --brand: #2fb985; --brand-ink: #06130d; --brand-soft: #173a2c;
  --good: #3cc48a; --good-bg: #163527; --bad: #ff7a70; --bad-bg: #40201e; --warn: #f2a93b; --warn-bg: #3b2c10; --neutral: #9fb0a7; --neutral-bg: #26322b;
  --c1: #3cc48a; --c2: #6aa1ee; --c-spark: #3cc48a; --c-prev: #6b7b73;
  --g-work: #3cc48a; --g-breakdown: #ff7a70; --g-tyre: #f2b04a; --g-permit: #a58ae6; --g-fuel: #55bfd9; --g-nodriver: #7ea0dc; --g-maint: #e0915e; --g-other: #8fa098;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1411; --surface: #172019; --surface-2: #1c2620; --ink: #e8efeb; --ink-2: #aab9b1; --muted: #7f8f87;
  --line: #2a362f; --track: #25312a; --axis: #46554d; --hover: rgba(60,196,138,.12); --shade: rgba(160,180,170,.10);
  --asphalt: #0a0f0c; --asphalt-2: #151d18; --brand: #2fb985; --brand-ink: #06130d; --brand-soft: #173a2c;
  --good: #3cc48a; --good-bg: #163527; --bad: #ff7a70; --bad-bg: #40201e; --warn: #f2a93b; --warn-bg: #3b2c10; --neutral: #9fb0a7; --neutral-bg: #26322b;
  --c1: #3cc48a; --c2: #6aa1ee; --c-spark: #3cc48a; --c-prev: #6b7b73;
  --g-work: #3cc48a; --g-breakdown: #ff7a70; --g-tyre: #f2b04a; --g-permit: #a58ae6; --g-fuel: #55bfd9; --g-nodriver: #7ea0dc; --g-maint: #e0915e; --g-other: #8fa098;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13.5px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
.num, td.n, th.n { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-disp); margin: 0; font-weight: 600; letter-spacing: .01em; text-wrap: balance; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- app frame ---------- */
#app { display: grid; grid-template-columns: 208px minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); height: 100%; }
.top { grid-column: 1 / -1; background: var(--asphalt); color: var(--on-asphalt); display: flex; align-items: center; gap: 14px; padding: 8px 16px; position: relative; flex-wrap: wrap; }
.top::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: repeating-linear-gradient(90deg, var(--amber) 0 22px, transparent 22px 40px); opacity: .9; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand b { font: 700 19px/1 var(--f-disp); letter-spacing: .04em; text-transform: uppercase; display: block; white-space: nowrap; }
.brand small { font-size: 11px; color: var(--on-asphalt-2); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.top .sp { flex: 1; }
.fresh { display: flex; flex-direction: column; align-items: flex-end; font-size: 11.5px; color: var(--on-asphalt-2); line-height: 1.25; }
.fresh b { color: var(--on-asphalt); font-weight: 600; font-family: var(--f-mono); font-size: 12px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--brand); }
.btn.pri { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn.ghost { background: transparent; }
.top .btn { background: var(--asphalt-2); border-color: #34433b; color: var(--on-asphalt); }
.top .btn:hover { border-color: var(--amber); }
.top .btn.pri { background: var(--amber); border-color: var(--amber); color: #1a1500; }
.ib { width: 32px; height: 32px; padding: 0; justify-content: center; }

.rail { grid-column: 1; grid-row: 2 / span 2; background: var(--surface); border-right: 1px solid var(--line); padding: 12px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.rail a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-weight: 500; cursor: pointer; position: relative; }
.rail a svg { flex: none; opacity: .85; }
.rail a:hover { background: var(--hover); color: var(--ink); }
.rail a[aria-current="page"] { background: var(--brand-soft); color: var(--ink); font-weight: 600; }
.rail a[aria-current="page"]::before { content: ''; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 4px; background: var(--amber); border-radius: 0 3px 3px 0; }
.rail .badge { margin-left: auto; font: 600 11px var(--f-mono); background: var(--bad); color: #fff; border-radius: 9px; padding: 1px 6px; }
.rail .foot { margin-top: auto; padding: 10px; font-size: 11px; color: var(--muted); }

.filters { grid-column: 2; grid-row: 2; background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; position: relative; z-index: 20; }
.filters .lab { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; flex-basis: 100%; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--brand-soft); border: 1px solid transparent; border-radius: 12px; padding: 1px 4px 1px 10px; font-size: 12px; }
.chip button { border: 0; background: transparent; padding: 0 5px; font-size: 14px; line-height: 18px; color: var(--ink-2); border-radius: 8px; }
.chip button:hover { color: var(--bad); }
.chip.range { background: var(--surface-2); border-color: var(--line); }

.ms { position: relative; }
.ms > button { min-width: 116px; justify-content: space-between; }
.ms.on > button { border-color: var(--brand); background: var(--brand-soft); }
.ms .pop { position: absolute; top: calc(100% + 4px); left: 0; z-index: 40; width: 280px; max-height: 340px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow), 0 12px 32px rgba(0,0,0,.18); display: flex; flex-direction: column; }
.ms .pop input[type=search] { margin: 8px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.ms .opts { overflow-y: auto; padding: 0 4px 6px; }
.ms label { display: flex; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 5px; cursor: pointer; }
.ms label:hover { background: var(--hover); }
.ms label span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms label em { font: 11px var(--f-mono); color: var(--muted); font-style: normal; }
.ms .acts { display: flex; justify-content: space-between; padding: 6px 8px; border-top: 1px solid var(--line); }
select.sel, input.dt { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 8px; }

main { grid-column: 2; grid-row: 3; overflow-y: auto; padding: 16px; scroll-behavior: smooth; }
.page { max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.ph { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.ph h1 { font-size: 26px; text-transform: uppercase; letter-spacing: .03em; }
.ph p { margin: 2px 0 0; color: var(--ink-2); max-width: 78ch; }
.ph .sp { flex: 1; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; box-shadow: var(--shadow); }
.card > h2, .card .ch h2 { font-size: 16px; text-transform: uppercase; letter-spacing: .05em; }
.ch { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.ch .sub { color: var(--muted); font-size: 12px; flex: 1 1 220px; min-width: 0; }
.ch .acts { display: flex; gap: 6px; align-items: center; }
.note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
.note b { color: var(--ink-2); }
.empty { padding: 24px; text-align: center; color: var(--muted); }

/* ---------- hero / road meter ---------- */
.hero { display: grid; grid-template-columns: minmax(300px, 1.3fr) repeat(4, minmax(130px, 1fr)); gap: 14px; }
.road { background: var(--asphalt); color: var(--on-asphalt); border-radius: 10px; padding: 14px 18px 16px; position: relative; overflow: hidden; min-width: 0; }
.road .lbl { font: 600 12px var(--f-body); text-transform: uppercase; letter-spacing: .1em; color: var(--on-asphalt-2); }
.road .big { font: 700 58px/1 var(--f-disp); letter-spacing: -.01em; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
.road .big small { font-size: 28px; font-weight: 500; opacity: .75; }
.road .cmp { font-size: 12.5px; color: var(--on-asphalt-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lane { position: relative; height: 22px; margin-top: 12px; background: #2d3933; border-radius: 4px; overflow: visible; }
.lane .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #0b7a55, #34c38b); border-radius: 4px 0 0 4px; }
.lane .dash { position: absolute; left: 6px; right: 6px; top: 50%; height: 2px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.85) 0 14px, transparent 14px 26px); transform: translateY(-50%); }
.lane .tgt { position: absolute; top: -6px; bottom: -6px; width: 3px; background: var(--amber); border-radius: 2px; }
.lane .tgt::after { content: attr(data-l); position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 4px; font: 11px var(--f-mono); color: var(--amber); white-space: nowrap; }
.road .truck { position: absolute; top: -13px; width: 38px; transform: translateX(-100%); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow); min-width: 0; text-align: left; }
button.tile:hover { border-color: var(--brand); }
.tile .lbl { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.tile .v { font: 700 32px/1.05 var(--f-disp); font-variant-numeric: tabular-nums; }
.tile .d { font-size: 12px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tile svg.spark { margin-top: 4px; max-width: 100%; }

/* ---------- state pills ---------- */
.st { display: inline-flex; align-items: center; gap: 4px; font: 600 12px var(--f-body); border-radius: 11px; padding: 1px 8px 1px 6px; white-space: nowrap; }
.st i { font-style: normal; font-weight: 700; font-size: 13px; line-height: 1; }
.st.better { color: var(--good); background: var(--good-bg); }
.st.worse { color: var(--bad); background: var(--bad-bg); }
.st.attention { color: #fff; background: var(--bad); }
:root[data-theme="dark"] .st.attention { color: #2a0b08; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .st.attention { color: #2a0b08; } }
.st.stable, .st.neutral, .st.na, .st.nocompare { color: var(--neutral); background: var(--neutral-bg); }
.dl.better { color: var(--good); } .dl.worse, .dl.attention { color: var(--bad); } .dl.stable, .dl.neutral { color: var(--ink-2); }
.sev { font: 700 11px var(--f-body); letter-spacing: .06em; text-transform: uppercase; border-radius: 4px; padding: 2px 7px; color: #fff; white-space: nowrap; }
.sev.s3 { background: var(--bad); } .sev.s2 { background: #d9822b; } .sev.s1 { background: #8a7a1f; } .sev.s0 { background: var(--neutral); }
:root[data-theme="dark"] .sev { color: #151515; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sev { color: #151515; } }

/* ---------- tables ---------- */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { position: sticky; top: 0; background: var(--surface-2); font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); white-space: nowrap; cursor: pointer; user-select: none; z-index: 1; }
th.n, td.n { text-align: right; }
th .ar { opacity: .6; margin-left: 3px; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--hover); }
tr.grp td { background: var(--surface-2); font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); padding: 5px 10px; }
.tb { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.tb input[type=search] { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 5px 9px; min-width: 190px; }
.tb .cnt { color: var(--muted); font-size: 12px; flex: 1; }
.pill { display: inline-block; border-radius: 4px; padding: 0 6px; font-size: 12px; font-weight: 500; white-space: nowrap; color: #fff; }
:root[data-theme="dark"] .pill { color: #121212; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill { color: #121212; } }
.bar { display: inline-block; height: 8px; border-radius: 4px; background: var(--c1); vertical-align: middle; min-width: 1px; }
.mini { display: inline-flex; align-items: center; gap: 6px; }
.mini .trk { width: 70px; height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; display: inline-block; }
.mini .trk i { display: block; height: 100%; background: var(--c1); }
td.trunc { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td .k { font: 12px var(--f-mono); }
.kpi-t td:first-child { min-width: 230px; }
.info { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--axis); color: var(--muted); font: 600 9px var(--f-body); margin-left: 5px; cursor: help; vertical-align: 1px; }

/* ---------- charts ---------- */
.chart { width: 100%; position: relative; }
.chart svg { display: block; max-width: 100%; overflow: visible; }
.chart svg text { font-family: var(--f-body); }
.gl { stroke: var(--line); stroke-width: 1; }
.ax { font-size: 11px; fill: var(--muted); }
.lb { font-size: 12px; fill: var(--ink-2); }
.vl { font-size: 11.5px; fill: var(--ink); font-family: var(--f-mono) !important; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 6px; font-size: 12px; color: var(--ink-2); }
.legend .lg { display: inline-flex; align-items: center; gap: 6px; }
.legend .lg.off { opacity: .4; text-decoration: line-through; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.legend i.ln { height: 3px; width: 14px; border-radius: 2px; }
.hrow:hover rect:first-child { fill: var(--hover) !important; }
.tt { position: fixed; z-index: 1000; background: var(--asphalt); color: var(--on-asphalt); border-radius: 7px; padding: 7px 10px; font-size: 12px; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.28); max-width: 320px; }
.tt-h { font-weight: 600; margin-bottom: 3px; }
.tt-r { display: flex; gap: 7px; align-items: center; }
.tt-r i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.tt-r b { font-family: var(--f-mono); font-weight: 600; }
.tt-r span { color: var(--on-asphalt-2); }
svg.spark { vertical-align: middle; }

/* ---------- action centre ---------- */
.issue { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.issue:last-child { border-bottom: 0; }
.issue .rk { font: 700 22px/1 var(--f-disp); color: var(--muted); text-align: center; padding-top: 2px; }
.issue h3 { font: 600 16px/1.25 var(--f-body); letter-spacing: 0; }
.issue .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.issue p { margin: 3px 0; color: var(--ink-2); }
.issue .act { color: var(--ink); }
.issue .act b { color: var(--brand); }
.issue .score { font: 11.5px var(--f-mono); color: var(--muted); }
.issue .side { text-align: right; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.good-i { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.good-i:last-child { border-bottom: 0; }
.good-i b { display: block; }
.good-i span { color: var(--ink-2); font-size: 12.5px; }
.good-i .ck { color: var(--good); font-weight: 700; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(8,14,11,.45); z-index: 90; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); background: var(--bg); z-index: 100; display: flex; flex-direction: column; box-shadow: -10px 0 40px rgba(0,0,0,.3); }
.drawer header { background: var(--asphalt); color: var(--on-asphalt); padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start; position: relative; padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
.drawer header h2 { font-size: 20px; letter-spacing: .02em; }
.drawer header small { color: var(--on-asphalt-2); display: block; }
.drawer header .sp { flex: 1; min-width: 0; }
.drawer .body { overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 12px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.kv div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.kv small { display: block; color: var(--muted); font: 600 10.5px var(--f-body); text-transform: uppercase; letter-spacing: .06em; }
.kv b { font: 700 20px var(--f-disp); font-variant-numeric: tabular-nums; }

/* ---------- misc ---------- */
.crumbs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

<div id="app"></div>
<script>
var GL = {};
/* ------------------------------------------------------------------
 * GL.xlsx — minimal, dependency-free .xlsx / .xlsm reader.
 * Uses the browser's DecompressionStream to inflate zip members and
 * a tolerant scanner for the sheet XML. Reads only the sheets asked for.
 * ------------------------------------------------------------------ */
GL.xlsx = (function () {
  'use strict';

  const td = new TextDecoder('utf-8');

  function u32(dv, o) { return dv.getUint32(o, true); }
  function u16(dv, o) { return dv.getUint16(o, true); }

  async function inflateRaw(bytes) {
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  /** Parse the zip central directory. Returns {entries: Map(name -> info), buf} */
  function openZip(buf) {
    const bytes = new Uint8Array(buf);
    const dv = new DataView(buf);
    // locate End Of Central Directory
    let eocd = -1;
    const minPos = Math.max(0, bytes.length - 65557);
    for (let i = bytes.length - 22; i >= minPos; i--) {
      if (bytes[i] === 0x50 && bytes[i + 1] === 0x4b && bytes[i + 2] === 5 && bytes[i + 3] === 6) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('Not a valid Excel file (zip directory not found).');
    const count = u16(dv, eocd + 10);
    let cdOff = u32(dv, eocd + 16);
    const entries = new Map();
    let p = cdOff;
    for (let n = 0; n < count; n++) {
      if (u32(dv, p) !== 0x02014b50) break;
      const method = u16(dv, p + 10);
      const csize = u32(dv, p + 20);
      const usize = u32(dv, p + 24);
      const nlen = u16(dv, p + 28), xlen = u16(dv, p + 30), clen = u16(dv, p + 32);
      const lho = u32(dv, p + 42);
      const name = td.decode(bytes.subarray(p + 46, p + 46 + nlen));
      entries.set(name, { name, method, csize, usize, lho });
      p += 46 + nlen + xlen + clen;
    }
    return { entries, bytes, dv };
  }

  async function zipRead(zip, name) {
    const e = zip.entries.get(name);
    if (!e) return null;
    const { dv, bytes } = zip;
    const o = e.lho;
    if (u32(dv, o) !== 0x04034b50) throw new Error('Corrupt zip entry: ' + name);
    const start = o + 30 + u16(dv, o + 26) + u16(dv, o + 28);
    const data = bytes.subarray(start, start + e.csize);
    if (e.method === 0) return data;
    if (e.method === 8) return inflateRaw(data);
    throw new Error('Unsupported zip compression (' + e.method + ') in ' + name);
  }

  async function zipText(zip, name) {
    const b = await zipRead(zip, name);
    return b ? td.decode(b) : null;
  }

  // ---- XML helpers -------------------------------------------------
  const ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'" };
  function unesc(s) {
    if (s.indexOf('&') < 0 && s.indexOf('_x') < 0) return s;
    return s
      .replace(/&(#x[0-9a-fA-F]+|#\d+|amp|lt|gt|quot|apos);/g, (m, g) => {
        if (g[0] === '#') return String.fromCodePoint(g[1] === 'x' ? parseInt(g.slice(2), 16) : parseInt(g.slice(1), 10));
        return ENT[g];
      })
      .replace(/_x([0-9A-Fa-f]{4})_/g, (m, h) => String.fromCharCode(parseInt(h, 16)));
  }
  function attr(tag, name) {
    const re = new RegExp('(?:^|\\s)' + name + '="([^"]*)"');
    const m = re.exec(tag);
    return m ? unesc(m[1]) : null;
  }
  function colIndex(letters) {
    let n = 0;
    for (let i = 0; i < letters.length; i++) n = n * 26 + (letters.charCodeAt(i) - 64);
    return n - 1;
  }

  function parseSharedStrings(xml) {
    const out = [];
    if (!xml) return out;
    const re = /<si\b[^>]*?(?:\/>|>([\s\S]*?)<\/si>)/g;
    let m;
    while ((m = re.exec(xml))) {
      const body = m[1];
      if (!body) { out.push(''); continue; }
      const clean = body.indexOf('<rPh') >= 0 ? body.replace(/<rPh[\s\S]*?<\/rPh>/g, '') : body;
      let s = '';
      const tre = /<t\b[^>]*?(?:\/>|>([\s\S]*?)<\/t>)/g;
      let t;
      while ((t = tre.exec(clean))) if (t[1]) s += t[1];
      out.push(unesc(s));
    }
    return out;
  }

  /** Parse sheet XML to an array of rows (arrays). Missing cells are undefined. */
  function parseSheet(xml, sst, opts) {
    const maxRows = (opts && opts.maxRows) || Infinity;
    const rows = [];
    let pos = 0, autoRow = 0;
    while (true) {
      const i = xml.indexOf('<row', pos);
      if (i < 0) break;
      const nc = xml.charCodeAt(i + 4);
      if (nc !== 32 && nc !== 62 && nc !== 47) { pos = i + 4; continue; } // not a <row> element (e.g. <rowBreaks>)
      const tagEnd = xml.indexOf('>', i);
      const selfClose = xml.charCodeAt(tagEnd - 1) === 47;
      const rowTag = xml.slice(i + 4, tagEnd);
      let rIdx;
      const ra = attr(rowTag, 'r');
      rIdx = ra ? parseInt(ra, 10) - 1 : autoRow;
      autoRow = rIdx + 1;
      if (rIdx >= maxRows) break;
      if (selfClose) { pos = tagEnd + 1; continue; }
      const end = xml.indexOf('</row>', tagEnd);
      const body = xml.slice(tagEnd + 1, end < 0 ? xml.length : end);
      pos = end < 0 ? xml.length : end + 6;
      const arr = [];
      let cp = 0, autoCol = 0;
      while (true) {
        const ci = body.indexOf('<c', cp);
        if (ci < 0) break;
        const nch = body.charCodeAt(ci + 2);
        if (nch !== 32 && nch !== 62 && nch !== 47) { cp = ci + 2; continue; } // skip <col…> etc.
        const ce = body.indexOf('>', ci);
        const cSelf = body.charCodeAt(ce - 1) === 47;
        const ctag = body.slice(ci + 2, ce);
        let col;
        const rm = /\sr="([A-Z]+)\d+"/.exec(ctag);
        col = rm ? colIndex(rm[1]) : autoCol;
        autoCol = col + 1;
        if (cSelf) { cp = ce + 1; continue; }
        const cend = body.indexOf('</c>', ce);
        const inner = body.slice(ce + 1, cend < 0 ? body.length : cend);
        cp = cend < 0 ? body.length : cend + 4;
        const tm = /\st="([^"]*)"/.exec(ctag);
        const t = tm ? tm[1] : 'n';
        let val;
        if (t === 'inlineStr') {
          let s = '';
          const tre = /<t\b[^>]*?(?:\/>|>([\s\S]*?)<\/t>)/g; let x;
          while ((x = tre.exec(inner))) if (x[1]) s += x[1];
          val = unesc(s);
        } else {
          const a = inner.indexOf('<v');
          if (a < 0) continue;
          const a2 = inner.indexOf('>', a) + 1;
          const b = inner.indexOf('</v>', a2);
          const raw = inner.slice(a2, b < 0 ? inner.length : b);
          if (t === 's') val = sst[+raw];
          else if (t === 'str') val = unesc(raw);
          else if (t === 'b') val = raw === '1';
          else if (t === 'e') val = raw;           // '#REF!' etc.
          else if (t === 'd') val = raw;           // ISO date string
          else { val = raw === '' ? undefined : +raw; if (val !== undefined && isNaN(val)) val = raw; }
        }
        if (val !== undefined) arr[col] = val;
      }
      rows[rIdx] = arr;
    }
    return rows;
  }

  // ---- Public API --------------------------------------------------
  async function open(arrayBuffer) {
    const zip = openZip(arrayBuffer);
    const wbXml = await zipText(zip, 'xl/workbook.xml');
    if (!wbXml) throw new Error('This file has no workbook part – is it an Excel .xlsx/.xlsm file?');
    const relsXml = (await zipText(zip, 'xl/_rels/workbook.xml.rels')) || '';
    const rels = {};
    const rre = /<Relationship\b([^>]*?)\/?>/g; let m;
    while ((m = rre.exec(relsXml))) {
      const id = attr(m[1], 'Id'), tg = attr(m[1], 'Target');
      if (id && tg) rels[id] = tg.charAt(0) === '/' ? tg.slice(1) : 'xl/' + tg.replace(/^\.\//, '');
    }
    const sheets = [];
    const sre = /<(?:\w+:)?sheet\b([^>]*?)\/?>/g;
    while ((m = sre.exec(wbXml))) {
      const name = attr(m[1], 'name');
      const rid = attr(m[1], 'r:id') || attr(m[1], 'id');
      if (!name) continue;
      sheets.push({ name, state: attr(m[1], 'state') || 'visible', path: rels[rid] });
    }
    let sst = null;
    async function getSST() {
      if (sst) return sst;
      const x = await zipText(zip, 'xl/sharedStrings.xml');
      sst = parseSharedStrings(x);
      return sst;
    }
    return {
      sheets,
      sheetNames: sheets.map(s => s.name),
      has(name) { return sheets.some(s => s.name === name); },
      async readSheet(name, opts) {
        const s = sheets.find(x => x.name === name);
        if (!s || !s.path) throw new Error('Sheet not found: ' + name);
        const [xml, strings] = await Promise.all([zipText(zip, s.path), getSST()]);
        if (!xml) return [];
        return parseSheet(xml, strings, opts);
      }
    };
  }

  /** Excel serial date (number) -> 'YYYY-MM-DD' (UTC, no tz drift). */
  function serialToISO(n) {
    const ms = Math.round((Math.floor(n) - 25569) * 86400000);
    return new Date(ms).toISOString().slice(0, 10);
  }

  return { open, serialToISO, unesc };
})();

/* ------------------------------------------------------------------
 * GL.ingest — recognises the three kinds of Greenline workbooks and
 * extracts clean intermediate structures from them.
 *
 *   DU   "DU Asset Dashboard"  : one sheet per day, vehicle x driver x status
 *   DRV  "Driverwise Productivity": vehicle KM/fuel, driver movement, vendors
 *   FLT  "Fleet Dashboard"     : long-format vehicle/driver/status rows + settings
 *
 * Nothing is hard-coded to a reporting month: dates, columns, statuses and
 * vehicle counts are all discovered from the files.
 * ------------------------------------------------------------------ */
GL.ingest = (function () {
  'use strict';
  const X = GL.xlsx;
  const MON = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
  const DAILY_RE = /^asset\s*#?\s*attached\s*to\s*drv\s*(\d{1,2})\s*([a-z]{3})/i;

  // ---------- small helpers ----------------------------------------
  const isNum = v => typeof v === 'number' && isFinite(v);
  function str(v) { return v == null ? '' : String(v).replace(/[ ​]/g, ' ').replace(/\s+/g, ' ').trim(); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function iso(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function validDay(y, m, d) { const t = new Date(Date.UTC(y, m, d)); return t.getUTCMonth() === m && t.getUTCDate() === d; }

  /** Excel serial, ISO text, "5-Sep", "05-Sep-26", "05/09/2026" -> 'YYYY-MM-DD' or ''. */
  function toISO(v, yearHint) {
    if (isNum(v)) return v > 20000 && v < 80000 ? X.serialToISO(v) : '';
    const s = str(v);
    if (!s) return '';
    let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    if (m) return validDay(+m[1], +m[2] - 1, +m[3]) ? m[1] + '-' + m[2] + '-' + m[3] : '';
    m = /^(\d{1,2})[-\/ ]([A-Za-z]{3})[a-z]*(?:[-\/ ,]+(\d{2,4}))?$/.exec(s);
    if (m) {
      const mon = MON[m[2].toLowerCase()];
      if (mon == null) return '';
      let y = m[3] ? +m[3] : yearHint;
      if (!y) return '';
      if (y < 100) y += 2000;
      return validDay(y, mon, +m[1]) ? iso(y, mon, +m[1]) : '';
    }
    m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(s);
    if (m) { let y = +m[3]; if (y < 100) y += 2000; return validDay(y, +m[2] - 1, +m[1]) ? iso(y, +m[2] - 1, +m[1]) : ''; }
    return '';
  }

  /** Vehicle registration -> canonical key. Returns '' if it does not look like one. */
  function normVeh(v) {
    const s = str(v).toUpperCase().replace(/[\s\-.]/g, '');
    if (s.length < 6 || s.length > 14) return '';
    if (!/^[A-Z0-9]+$/.test(s) || !/[A-Z]/.test(s) || !/\d/.test(s)) return '';
    return s;
  }
  const STD_PLATE = /^[A-Z]{2}\d{1,2}[A-Z]{1,3}\d{1,4}$/;

  function titleCase(s) {
    return s.toLowerCase().replace(/(^|[\s.'-])([a-z])/g, (m, a, b) => a + b.toUpperCase());
  }
  /** "47520 - SITA RAM KUMHAR  " -> {code:'47520', name:'Sita Ram Kumhar'} */
  function parseDriver(v) {
    const s = str(v);
    if (!s || /^(na|n\/a|nil|-|0)$/i.test(s)) return null;
    let m = /^(\d{3,8})\s*[-–:]\s*(.*)$/.exec(s);
    if (m) return { code: m[1], name: titleCase(m[2] || ''), raw: s };
    if (/^\d{3,8}$/.test(s)) return { code: s, name: '', raw: s };
    return { code: '', name: titleCase(s), raw: s };
  }
  function cleanStatus(v) { return str(v).replace(/\s*-\s*/g, ' - '); }
  function cell(rows, r, c) { const row = rows[r]; return row ? row[c] : undefined; }
  function rowText(row) { return (row || []).map(str).join('|'); }

  function findRow(rows, test, from, to) {
    const end = Math.min(rows.length, to == null ? 80 : to);
    for (let r = from || 0; r < end; r++) {
      const row = rows[r];
      if (!row) continue;
      for (let c = 0; c < row.length; c++) if (row[c] != null && test(str(row[c]), c, row)) return r;
    }
    return -1;
  }
  /** Return value to the right of a label cell (first non-empty within 4 columns). */
  function labelValue(rows, re, maxRows) {
    const end = Math.min(rows.length, maxRows || 200);
    for (let r = 0; r < end; r++) {
      const row = rows[r]; if (!row) continue;
      for (let c = 0; c < row.length; c++) {
        if (typeof row[c] === 'string' && re.test(str(row[c]))) {
          for (let k = 1; k <= 4; k++) { const v = row[c + k]; if (v != null && str(v) !== '') return v; }
        }
      }
    }
    return undefined;
  }
  function mkDQ() {
    const list = [];
    list.add = function (id, level, title, count, examples, detail) {
      if (!count) return;
      list.push({ id, level, title, count, examples: (examples || []).slice(0, 6), detail: detail || '' });
    };
    return list;
  }
  function guessYear(name) { const m = /(20\d{2})/.exec(name || ''); return m ? +m[1] : 0; }

  // ---------- file classification ----------------------------------
  async function peekLongForm(book, sheetName) {
    try {
      const rows = await book.readSheet(sheetName, { maxRows: 6 });
      for (let r = 0; r < rows.length; r++) {
        const t = rowText(rows[r]).toLowerCase().replace(/[\s_]/g, '');
        if (t.includes('snapshotdate') && t.includes('vehicleno') && t.includes('vehiclestatus')) return true;
      }
    } catch (e) { /* ignore */ }
    return false;
  }

  async function classify(book) {
    const names = book.sheetNames;
    const kinds = [];
    if (names.some(n => DAILY_RE.test(n))) kinds.push('DU');
    if (names.some(n => /ag-?grid/i.test(n)) && names.some(n => /driver.?movement.?detail/i.test(n))) kinds.push('DRV');
    // long-form vehicle/driver/status sheet (Fleet Dashboard "Data", DU "Snapshot_History")
    let longSheet = null;
    for (const n of names) {
      if (/^data$|snapshot/i.test(n) && await peekLongForm(book, n)) { longSheet = n; break; }
    }
    if (longSheet) {
      const hasSettings = names.some(n => /^settings$/i.test(n));
      if (hasSettings || !kinds.includes('DU')) kinds.push('FLT');
    }
    return { kinds, longSheet };
  }

  // ---------- DU: daily asset sheets -------------------------------
  function resolveDUColumns(rows, hi) {
    const head = rows[hi] || [], group = rows[hi - 1] || [];
    const gstarts = [];
    for (let c = 0; c < Math.max(head.length, group.length); c++) { const g = str(group[c]); if (g) gstarts.push([c, g]); }
    const blockOf = c => { let t = ''; for (const [gc, g] of gstarts) if (gc <= c) t = g; return t; };
    const cols = [];
    for (let c = 0; c < head.length; c++) { const nm = str(head[c]); if (nm) cols.push({ c, nm, blk: blockOf(c) }); }
    function pick(nameRe, blkRe, nth) {
      const hits = cols.filter(x => nameRe.test(x.nm));
      if (!hits.length) return -1;
      if (blkRe) { const f = hits.filter(x => blkRe.test(x.blk)); if (f.length) return f[0].c; }
      return (hits[nth] || hits[hits.length - 1]).c;
    }
    const COMP = /compar|comper/i;
    return {
      truck: pick(/^truck/i),
      cD1: pick(/^driver\s*1\s*name/i, COMP, 1),
      cD2: pick(/^driver\s*2\s*name/i, COMP, 1),
      cStat: pick(/^(vech|vehicle)\w*\s*status/i, COMP, 1),
      mv1: pick(/^d1$/i, /internal\s*movement/i, 0),
      mv2: pick(/^d2$/i, /internal\s*movement/i, 0),
      nDrv: pick(/^#?\s*drivers?$/i),
      client: pick(/client\s*group/i),
      rem: pick(/./, /remarks\s*for\s*exit/i, 0)
    };
  }

  function sheetDate(rows, hi, sheetName, yearHint) {
    // "Comperator file Dated:" | <date serial>
    for (let r = 0; r < hi; r++) {
      const row = rows[r]; if (!row) continue;
      for (let c = 0; c < row.length; c++) {
        if (typeof row[c] === 'string' && /compar|comper/i.test(row[c]) && /dated?/i.test(row[c])) {
          for (let k = 1; k <= 3; k++) { const d = toISO(row[c + k], yearHint); if (d) return d; }
        }
      }
    }
    // base date year then sheet name "5Oct"
    let by = yearHint;
    for (let r = 0; r < hi && !by; r++) for (const v of rows[r] || []) { const d = toISO(v); if (d) { by = +d.slice(0, 4); break; } }
    const m = DAILY_RE.exec(sheetName);
    if (m && by) { const d = toISO(m[1] + '-' + m[2], by); if (d) return d; }
    return '';

    addDQ('du-overlap', 'info', 'Days present in more than one DU Asset file (the later file was used)', duOverlapDays, []);
    addDQ('du-conflict', 'warn', 'Vehicle status differs between overlapping DU Asset files', duConflict, duConfEx, 'Same vehicle and day, different status in two uploaded files.');

    const longByDate = new Map();  // date -> Map(veh -> {st, drv:[]})
    function addLong(date, veh, slot, code, name, st) {
      let m = longByDate.get(date); if (!m) longByDate.set(date, m = new Map());
      let o = m.get(veh); if (!o) m.set(veh, o = { st, drv: [] });
      if (code || name) o.drv.push({ slot, code, name });
    }
    fltFiles.forEach(p => p.flt.rows.forEach(r => addLong(r[0], r[1], r[2], r[3], r[4], r[5])));
    // Driverwise driver-movement rows act as a last-resort status source
    const moveDates = new Set();
    drvFiles.forEach(p => { const m = p.drv.move; if (m) m.date.forEach((d, i) => { if (m.veh[i]) { moveDates.add(d); if (!duByDate.has(d) && !longByDate.has(d)) { /* defer */ } } }); });
    drvFiles.forEach(p => {
      const m = p.drv.move; if (!m) return;
      const need = new Set([...moveDates].filter(d => !duByDate.has(d) && !longByDate.has(d)));
      if (!need.size) return;
      m.date.forEach((d, i) => { if (need.has(d) && m.veh[i]) addLong(d, m.veh[i], m.dtype[i] === 'D' ? 'D' : 'S', m.code[i], m.name[i], m.status[i]); });
    });

    // ---- reconcile Fleet long-format rows against DU days ---------------
    let rcAgree = 0, rcDis = 0, rcMissing = 0, rcEx = [];
    longByDate.forEach((m, d) => {
      const du = duByDate.get(d); if (!du) return;
      const dm = new Map(du.rows.map(r => [r.v, r.st]));
      m.forEach((o, v) => { if (!dm.has(v)) rcMissing++; else if (dm.get(v) === o.st) rcAgree++; else { rcDis++; if (rcEx.length < 5) rcEx.push(d + ' ' + v + ': DU "' + dm.get(v) + '" vs long-format "' + o.st + '"'); } });
    });
    const recon = { agree: rcAgree, disagree: rcDis, missing: rcMissing };
    addDQ('recon-dis', 'warn', 'Vehicle-days where the long-format file and the DU daily sheets disagree on status', rcDis, rcEx);

    // ---- calendar axis ---------------------------------------------------
    const allDates = new Set([...duByDate.keys(), ...longByDate.keys()]);
    const kmDatesAll = [];
    drvFiles.forEach(p => p.drv.km && p.drv.km.dates.forEach(d => { kmDatesAll.push(d); }));
    if (!allDates.size && !kmDatesAll.length) return { empty: true, dq, sources: sourceInfo(parsed) };
    const everyDate = [...allDates, ...kmDatesAll].sort();
    const d0 = everyDate[0], d1 = everyDate.at(-1);
    const D = dayDiff(d0, d1) + 1;
    const dates = []; for (let i = 0; i < D; i++) dates.push(addDays(d0, i));
    const di = new Map(dates.map((d, i) => [d, i]));
    const statusDates = [...allDates].sort();
    const gaps = []; for (let i = 0; i < D; i++) if (!allDates.has(dates[i]) && dates[i] >= statusDates[0] && dates[i] <= statusDates.at(-1)) gaps.push(dates[i]);
    addDQ('date-gaps', 'warn', 'Calendar days inside the data range with no status data', gaps.length, gaps);

    // ---- vehicles, drivers, statuses ---------------------------------------
    const vIdx = new Map(), vehicles = [];
    function vehOf(id, inFleet) {
      let i = vIdx.get(id);
      if (i == null) { i = vehicles.length; vIdx.set(id, i); vehicles.push({ id, client: '', sup: '', vtype: '', series: '', inFleet: !!inFleet, hasKm: false, first: -1, last: -1, clients: new Map() }); }
      if (inFleet) vehicles[i].inFleet = true;
      return i;
    }
    const dIdx = new Map(), drivers = [];
    function drvOf(code, name) {
      if (!code && !name) return -1;
      const key = code || 'N:' + name.toUpperCase();
      let i = dIdx.get(key);
      if (i == null) { i = drivers.length; dIdx.set(key, i); drivers.push({ code, name, key, vendor: '', first: -1, last: -1, days: 0, exit: -1, exitReason: '', join: -1, joinType: '', names: new Set() }); }
      if (name) drivers[i].names.add(name);
      if (name && !drivers[i].name) drivers[i].name = name;
      return i;
    }
    const stIdx = new Map(), statuses = [];
    function stOf(s) { if (!s) return -1; let i = stIdx.get(s); if (i == null) { i = statuses.length; stIdx.set(s, i); statuses.push(s); } return i; }

    // first pass: vehicles + statuses
    duByDate.forEach(day => day.rows.forEach(r => { vehOf(r.v, true); stOf(r.st); }));
    longByDate.forEach((m, d) => { if (!duByDate.has(d)) m.forEach((o, v) => { vehOf(v, true); stOf(o.st); }); else m.forEach((o, v) => { if (!vIdx.has(v)) vehOf(v, true); }); });
    const fltSettings = (fltFiles[0] && fltFiles[0].flt.settings) || {};
    const cfg = Object.assign({ goodKm: 233, attnKm: 183, goodAtt: 0.9, attnAtt: 0.7, revenuePerDay: 0 }, ...drvFiles.map(p => p.drv.cfg || {}));
    Object.keys(cfg).forEach(k => { if (cfg[k] == null) delete cfg[k]; });
    if (fltSettings.revenuePerDay != null) cfg.revenuePerDay = fltSettings.revenuePerDay;
    if (fltSettings.stuckWindow) opts.stuckDays = fltSettings.stuckWindow;
    let productive = fltSettings.productiveLabel || '';
    if (!productive || !stIdx.has(productive)) {
      productive = statuses.find(s => statusGroup(s) === 'work') || '';
    }
    if (!productive && statuses.length) {   // fall back to most frequent status
      const cnt = new Map(); duByDate.forEach(day => day.rows.forEach(r => cnt.set(r.st, (cnt.get(r.st) || 0) + 1)));
      productive = mode(cnt) || statuses[0];
    }
    const stGroup = statuses.map(s => statusGroup(s, productive));
    const stWeight = statuses.map((s, i) => {
      const m = fltSettings.statusMeta && fltSettings.statusMeta[s];
      return m && m.weight != null ? m.weight : DEF_W[stGroup[i]];
    });
    const unmapped = statuses.filter((s, i) => stGroup[i] === 'other' && !(fltSettings.statusMeta && fltSettings.statusMeta[s]));
    addDQ('unmapped-status', 'warn', 'Status labels not recognised (treated as downtime, weight 1.0)', unmapped.length, unmapped, 'Add a mapping in Settings if one of these is actually productive.');
    const pIdx = stIdx.get(productive);

    // ---- grids ----------------------------------------------------------------
    // km-only vehicles join after fleet vehicles
    drvFiles.forEach(p => p.drv.km && p.drv.km.vehicles.forEach(k => vehOf(k.v, false)));
    const V = vehicles.length;
    const N = V * D;
    const vs = new Int8Array(N).fill(-1), nd = new Int8Array(N).fill(-1);
    const dA = new Int32Array(N).fill(-1), dB = new Int32Array(N).fill(-1);
    const km = new Float32Array(N).fill(NaN), fuelKg = new Float32Array(N).fill(NaN), fuelAct = new Float32Array(N).fill(NaN), fuelTgt = new Float32Array(N).fill(NaN);
    const statusHasData = new Uint8Array(D);
    let wkNoDrv = 0, wkNoDrvEx = [], nameNoCode = 0, ndMismatch = 0, blankStatus = 0;
    const clientVotes = []; for (let i = 0; i < V; i++) clientVotes.push(null);

    function setCell(v, d, st, ds, ndCol) {
      const k = v * D + d;
      const si = stOf(st);

      const list = ds.filter(x => x);
      let a = -1, b = -1;
      if (list[0]) a = drvOf(list[0].code, list[0].name);
      if (list[1]) b = drvOf(list[1].code, list[1].name);
      dA[k] = a; dB[k] = b;
      const n = (a >= 0 ? 1 : 0) + (b >= 0 ? 1 : 0);
      nd[k] = n;
      if (ndCol != null && ndCol !== n) ndMismatch++;

    }
    duByDate.forEach((day, date) => {
      const d = di.get(date); statusDates; statusHasData[d] = 1;
      day.rows.forEach(r => {
        const v = vIdx.get(r.v);
        setCell(v, d, r.st, [r.d1, r.d2], r.nd);
        if (r.cl) { let m = vehicles[v].clients; m.set(r.cl, (m.get(r.cl) || 0) + 1); }
      });
    });
    longByDate.forEach((m, date) => {
      if (duByDate.has(date)) return;
      const d = di.get(date); statusHasData[d] = 1;
      m.forEach((o, vid) => {
        const v = vIdx.get(vid);
        const dsl = []; const seen = new Set();
        o.drv.forEach(x => { const key = x.code || x.name; if (!seen.has(key)) { seen.add(key); dsl.push({ code: x.code, name: x.name }); } });
        setCell(v, d, o.st, dsl.slice(0, 2), null);
      });
    });
    // vehicles with no row on a day inside a covered day are simply "not listed" (-1)
    addDQ('wk-no-driver', 'warn', 'Vehicle-days marked productive although no driver is assigned', wkNoDrv, wkNoDrvEx, 'Either the driver is missing from the sheet or the status is optimistic. Counted as available but also as "without driver".');
    addDQ('nd-mismatch', 'warn', 'Rows where the "#Drivers" column disagrees with the driver names', ndMismatch, []);
    addDQ('name-no-code', 'warn', 'Driver entries without an employee code', nameNoCode, [], 'These are matched on name only, which can merge or split people.');

    // ---- detect days that are an exact copy of the previous day ---------------------
    const sd0 = statusDates.map(d => di.get(d));
    const copiedDays = [];
    for (let i = 1; i < sd0.length; i++) {
      const d = sd0[i], p = sd0[i - 1];
      if (d - p !== 1) continue;
      let n = 0, same = 0;
      for (let v = 0; v < V; v++) {
        const k = v * D + d, q = v * D + p;
        if (vs[k] < 0 && vs[q] < 0) continue;
        n++; if (vs[k] === vs[q] && dA[k] === dA[q] && dB[k] === dB[q]) same++;
      }
      if (n >= 20 && same === n) copiedDays.push(d);
    }
    if (copiedDays.length) {
      addDQ('copied-day', opts.dropCopied ? 'error' : 'warn', 'Days that are an exact copy of the previous day (no vehicle changed status or driver)', copiedDays.length, copiedDays.map(d => dates[d]),
        opts.dropCopied ? 'Excluded from the analysis because a real day always has some movement. Upload the real sheet (a later file replaces the same date) or switch this off in Settings.' : 'Included in the analysis at your request.');
      if (opts.dropCopied) copiedDays.forEach(d => { statusHasData[d] = 0; for (let v = 0; v < V; v++) { const k = v * D + d; vs[k] = -1; nd[k] = -1; dA[k] = -1; dB[k] = -1; } });
    }
    const statusIdx = []; for (let d = 0; d < D; d++) if (statusHasData[d]) statusIdx.push(d);

    // ---- vehicle attributes ---------------------------------------------------------
    const kmVeh = new Map();
    let kmFiles = drvFiles.filter(p => p.drv.km);
    kmFiles.forEach(p => {
      const kd = p.drv.km.dates.map(x => di.get(x));
      p.drv.km.vehicles.forEach(o => {
        const v = vIdx.get(o.v); if (v == null) return;
        const veh = vehicles[v]; veh.hasKm = true;
        if (o.sup) veh.sup = o.sup; if (o.vtype) veh.vtype = o.vtype;
        if (o.client) veh.kmClient = o.client;
        for (let j = 0; j < kd.length; j++) {
          const d = kd[j]; if (d == null) continue;
          const k = v * D + d;
          if (o.odo) km[k] = o.odo[j];
          if (o.fuelKg) fuelKg[k] = o.fuelKg[j];
          if (o.fuelAct) fuelAct[k] = o.fuelAct[j];
          if (o.fuelTgt) fuelTgt[k] = o.fuelTgt[j];
        }
        if (o.tgtMil) { let s = 0, n = 0; for (const x of o.tgtMil) if (isFinite(x)) { s += x; n++; } if (n) veh.tgtMileage = s / n; }
      });
    });
    const kmHas = new Uint8Array(D);
    for (let v = 0; v < V; v++) for (let d = 0; d < D; d++) if (!isNaN(km[v * D + d])) kmHas[d] = 1;

    let clientDis = 0, clientDisEx = [], noClient = 0, noSup = 0;
    vehicles.forEach(v => {
      v.client = v.clients.size ? mode(v.clients) : (v.kmClient || '');
      if (v.kmClient && v.clients.size && v.kmClient !== v.client) { clientDis++; if (clientDisEx.length < 5) clientDisEx.push(v.id + ': ' + v.client + ' vs ' + v.kmClient); }
      if (!v.client) { v.client = 'Unassigned'; if (v.inFleet) noClient++; }
      if (!v.sup) { v.sup = 'Unassigned'; if (v.inFleet) noSup++; }
      if (!v.vtype) v.vtype = 'Unknown';
      v.series = v.id.slice(0, Math.max(4, v.id.length - opts.seriesTrim));
      delete v.clients;
    });
    addDQ('client-dis', 'warn', 'Vehicles whose client differs between the DU sheets and the Driverwise KM grid (DU value used)', clientDis, clientDisEx);
    addDQ('no-client', 'warn', 'Fleet vehicles with no client / site in any file', noClient, []);
    addDQ('no-sup', 'warn', 'Fleet vehicles with no supervisor in the KM grid', noSup, []);
    const nonFleet = vehicles.filter(v => !v.inFleet);
    if (nonFleet.length) {
      let kmNF = 0, kmAll = 0, nz = 0;
      vehicles.forEach((v, i) => { let s = 0; for (let d = 0; d < D; d++) { const x = km[i * D + d]; if (x > 0) s += x; } kmAll += s; if (!v.inFleet) { kmNF += s; if (s > 0) nz++; } });
      addDQ('km-only', 'warn', 'Vehicles in the KM grid but not in any status sheet (excluded from fleet KPIs)', nonFleet.length, nonFleet.map(v => v.id), nz + ' of them recorded KM, together ' + Math.round(kmNF).toLocaleString('en-IN') + ' km (' + (kmAll ? (100 * kmNF / kmAll).toFixed(1) : 0) + '% of all KM in the grid).');
    }
    const fleetNoKm = vehicles.filter(v => v.inFleet && !v.hasKm);
    addDQ('fleet-no-km', 'warn', 'Fleet vehicles with no KM record', fleetNoKm.length, fleetNoKm.map(v => v.id));

    // KM sanity
    let negKm = 0, hugeKm = 0, negFuel = 0, kmOnNoStatus = 0;
    for (let k = 0; k < N; k++) { const x = km[k]; if (x < 0) negKm++; else if (x > 1500) hugeKm++; if (fuelKg[k] < 0) negFuel++; }
    addDQ('km-neg', 'error', 'Negative KM values', negKm, []);
    addDQ('km-huge', 'warn', 'Vehicle-days with more than 1,500 km (check odometer entry)', hugeKm, []);
    addDQ('fuel-neg', 'warn', 'Negative fuel-consumption entries (refuel / dip corrections)', negFuel, [], 'Net totals stay correct, but daily mileage on those days is meaningless.');
    const lastStat = statusIdx.length ? statusIdx.at(-1) : -1;
    let lastKm = -1; for (let d = D - 1; d >= 0; d--) if (kmHas[d]) { lastKm = d; break; }
    if (lastStat > lastKm && lastKm >= 0) addDQ('km-behind', 'warn', 'KM data ends before status data', lastStat - lastKm, [dates[lastKm + 1] + ' … ' + dates[lastStat]], 'KM figures for the most recent day(s) are not available; KM KPIs use days that have KM.');

    // ---- driver presence ----------------------------------------------------------------
    const Dr = drivers.length;
    const dp = new Uint8Array(Dr * D), dvh = new Int32Array(Dr * D).fill(-1);
    let multiVeh = 0, multiEx = [];
    for (let v = 0; v < V; v++) for (let d = 0; d < D; d++) {
      const k = v * D + d; if (vs[k] < 0) continue;
      for (const x of [dA[k], dB[k]]) {

        if (dp[q] && dvh[q] !== v) { multiVeh++; if (multiEx.length < 5) multiEx.push(dates[d] + ' · ' + (drivers[x].code || drivers[x].name)); }

    }
    addDQ('multi-veh', 'warn', 'Driver-days where one driver is listed on two vehicles at once (first vehicle kept)', multiVeh, multiEx);

    // vendor map
    const vendorVotes = new Map();
    const canon = new Set();
    drvFiles.forEach(p => { const m = p.drv.move; if (m) m.vendor.forEach(x => { if (x) canon.add(x); }); p.drv.hiring.forEach(h => h.vendor && canon.add(h.vendor)); });
    const canonList = [...canon];
    function canonVendor(raw) {
      if (!raw) return '';
      if (canon.has(raw)) return raw;
      const r = raw.trim();
      const hit = canonList.find(c => c.toLowerCase().startsWith(r.toLowerCase()) || r.toLowerCase().startsWith(c.toLowerCase().slice(0, 28)));
      return hit || r;
    }
    drvFiles.forEach(p => {
      const m = p.drv.move; if (!m) return;
      m.code.forEach((c, i) => { if (!c || !m.vendor[i]) return; let t = vendorVotes.get(c); if (!t) vendorVotes.set(c, t = new Map()); t.set(m.vendor[i], (t.get(m.vendor[i]) || 0) + 1); });
    });
    const hiringByCode = new Map(), attrByCode = new Map();
    parsed.forEach(p => {
      ((p.du && p.du.deploy) || []).concat((p.drv && p.drv.hiring) || []).forEach(h => { if (h.code && !hiringByCode.has(h.code)) hiringByCode.set(h.code, h); });

    });
    const vendorRef = Object.assign({}, ...drvFiles.map(p => p.drv.vendorRef || {}));
    let noVendor = 0;
    drivers.forEach(r => {
      const v = vendorVotes.get(r.code);
      r.vendor = v ? mode(v) : canonVendor(vendorRef[r.code]) || ((hiringByCode.get(r.code) || {}).vendor || '');
      if (!r.vendor) { r.vendor = 'Unknown'; noVendor++; }
    });
    addDQ('no-vendor', 'warn', 'Drivers with no vendor in any file', noVendor, []);
    // merge spelling variants of the same contractor (case, "Pvt Ltd", truncated names)
    {
      const vkey = n => n.toLowerCase().replace(/private|pvt|limited|ltd|llp|m\/s|[^a-z0-9]/g, '');
      const cnts = new Map(); drivers.forEach(r => { if (/^(#n\/a|n\/a|nan|-|)$/i.test((r.vendor || '').trim())) r.vendor = 'Unknown'; cnts.set(r.vendor, (cnts.get(r.vendor) || 0) + 1); });

      names.forEach(n => { const k = vkey(n); let c = clusters.find(c => k.startsWith(c.k.slice(0, Math.max(12, Math.min(c.k.length, 18)))) && c.k.length >= 8); if (!c) clusters.push(c = { k, members: [] }); c.members.push(n); });

      clusters.forEach(c => { const best = c.members.slice().sort((x, y) => (cnts.get(y) - cnts.get(x)) || (y.length - x.length))[0]; c.members.forEach(m => rename.set(m, best)); });
      drivers.forEach(r => { if (rename.has(r.vendor)) r.vendor = rename.get(r.vendor); });
    }
    const vendors = [...new Set(drivers.map(r => r.vendor))].sort();

    // ---- driver events (joins / exits / returns) ------------------------------------------------
    const joins = [], exits = [], returns = [];
    const lastStatDay = lastStat;
    const firstStatDay = statusIdx.length ? statusIdx[0] : 0;
    drivers.forEach((r, x) => {
      let f = -1, l = -1, n = 0, prev = -1;
      for (let d = firstStatDay; d <= lastStatDay; d++) {
        if (!dp[x * D + d]) continue;
        n++; if (f < 0) f = d; l = d;
        if (prev >= 0 && d - prev - 1 > opts.grace) { exits.push({ x, idx: prev + 1, final: false, gap: d - prev - 1 }); returns.push({ x, idx: d }); }
        prev = d;
      }
      r.first = f; r.last = l; r.days = n;
      if (f > firstStatDay) { const h = hiringByCode.get(r.code); r.join = f; r.joinType = h ? h.type : 'Unclassified'; joins.push({ x, idx: f, type: r.joinType }); }
      if (l >= 0 && lastStatDay - l > opts.grace) { r.exit = l + 1; const a = attrByCode.get(r.code); r.exitReason = a && a.reason ? a.reason : 'Not recorded'; exits.push({ x, idx: l + 1, final: true, gap: lastStatDay - l }); }
    });
    const attrList = [].concat(...drvFiles.map(p => p.drv.attrList || []));
    if (attrList.length) {
      const exSet = new Set(exits.filter(e => e.final).map(e => drivers[e.x].code));
      const listed = new Set(attrList.map(a => a.code));
      let both = 0; listed.forEach(c => { if (exSet.has(c)) both++; });
      recon.attr = { listed: listed.size, derived: exSet.size, matched: both };
      addDQ('attr-xcheck', both === listed.size && both === exSet.size ? 'info' : 'warn', 'Exit list in the Driverwise file vs exits derived from daily presence', Math.abs(listed.size - exSet.size) + (listed.size - both), [], 'Driverwise lists ' + listed.size + ' exits; ' + exSet.size + ' derived here; ' + both + ' appear in both.');
    }
    const blankAttrV = [].concat(...parsed.map(p => (p.du && p.du.attr) || [])).filter(a => !a.vendor).length;
    addDQ('attr-no-vendor', 'warn', 'Rows in "Attrition Remarks" with no contractor / cluster filled in', blankAttrV, [], 'Vendor-level attrition is therefore derived from the Driverwise vendor map instead.');

    // ---- age of unavailability + episodes -----------------------------------------------------------
    const age = new Int16Array(N);          // consecutive non-productive days ending on this day (any cause)
    const sameAge = new Int16Array(N);      // consecutive days with the same status
    const eps = [];                         // downtime episodes (same status run)
    for (let v = 0; v < V; v++) {
      let spell = 0, run = 0, runSt = -1, runStart = -1, firstListed = -1;
      for (let d = 0; d < D; d++) {
        const k = v * D + d, s = vs[k];
        if (s < 0) { close(d - 1, false); spell = 0; run = 0; runSt = -1; continue; }
        if (firstListed < 0) firstListed = d;
        if (s === pIdx) { close(d - 1, true); spell = 0; run = 0; runSt = -1; continue; }
        spell++; age[k] = spell;
        if (s === runSt) run++; else { close(d - 1, false, true); runSt = s; run = 1; runStart = d; }
        sameAge[k] = run;
      }
      close(D - 1, false);

          eps.push({ v, s: runSt, start: startIdx, end: endIdx, len: run, closed: !!closedByWork, left: startIdx === firstListed, open: !closedByWork && !switched });

        }

    }

    // ---- assemble ---------------------------------------------------------------------------------------
    const db = {
      dates, D, V, Dr, vehicles, drivers, vendors, statuses, stGroup, stWeight, pIdx, productive,
      vs, nd, dA, dB, km, fuelKg, fuelAct, fuelTgt, kmHas, statusHasData, dp, dvh, age, sameAge, eps,
      joins, exits, returns, hiringByCode, attrByCode, hiring: [...hiringByCode.values()],
      cfg, opts, recon, dq, sources: sourceInfo(parsed),
      firstStatus: statusIdx.length ? statusIdx[0] : 0, lastStatus: lastStat, lastKm, copiedDays: copiedDays.map(d => dates[d]),
      builtAt: Date.now(), blankStatus

      body.innerHTML = `<div class="card"><div class="set">${row('s_bench', 'KM benchmark per vehicle-day', S.bench, 1, 'Default is the “good KM” value in the Driverwise file.')}${row('s_attn', 'Attention KM per vehicle-day', S.attn, 1, 'Working vehicles below this count as under-utilised.')}${row('s_idle', 'Idle KM limit', S.idleKm, 1, 'A Working vehicle below this is treated as idle that day.')}${row('s_stuck', 'Stuck after (days unavailable)', S.stuckDays, 1)}${row('s_avail', 'Availability target (0–1)', S.availTarget, 0.01)}${row('s_rev', 'Revenue per vehicle-day (₹)', S.revenue, 100, 'Used only to put a rupee figure on lost vehicle-days. Default comes from the Fleet file. Set 0 to hide.')}${row('s_grace', 'Driver exit grace (days absent)', A.model.grace, 1, 'A driver unseen for more than this many days is counted as an exit.')}<label for="s_copy">Ignore days that copy the previous day</label><input type="checkbox" id="s_copy" ${A.model.dropCopied ? 'checked' : ''} style="justify-self:start"><small>Some sheets are an exact duplicate of the day before (for example a 1 Oct sheet created before it was filled in). Ignoring them stops them being counted as a real day.</small></div></div><div style="display:flex;gap:8px"><button class="btn pri" id="s_ok">Apply</button><button class="btn" id="s_def">Back to file defaults</button></div>`;
      const num = id => { const v = body.querySelector('#' + id).value; return v === '' ? null : +v; };
      body.querySelector('#s_ok').onclick = () => {
        A.user = { bench: num('s_bench'), attn: num('s_attn'), idleKm: num('s_idle'), stuckDays: num('s_stuck'), availTarget: num('s_avail'), revenue: num('s_rev') };
        const g = num('s_grace'), c = body.querySelector('#s_copy').checked; const re = (g != null && g !== A.model.grace) || c !== A.model.dropCopied;
        if (g != null) A.model.grace = g; A.model.dropCopied = c; savePrefs(); u.closeDrawer(); if (re) rebuild(); else recompute(); render(true);
      };
      body.querySelector('#s_def').onclick = () => { A.user = { bench: null, attn: null, idleKm: null, stuckDays: null, availTarget: null, revenue: null }; A.model = { grace: 3, dropCopied: true }; savePrefs(); u.closeDrawer(); rebuild(); render(true); };
    });
  }

  function boot() {
    A.go = go2; A.state = A;
    shell(); loadPrefs();
    const h = (location.hash || '').replace('#', ''); if (PAGES.some(p => p[0] === h)) A.page = h;
    render();
  }
  return { state: A, boot, go: go2, refresh, render, loadFiles, pick, PAGES };
})();

/* Shared page helpers + Executive Overview + Fleet Performance */
GL.pages = {};
GL.pg = (function () {
  'use strict';
  const u = GL.u, CH = GL.charts, K = GL.calc, esc = CH.esc, fin = CH.fin;
  const GN = { work: 'Working', breakdown: 'Breakdown', tyre: 'Tyres / parts', permit: 'Permit / fitness', fuel: 'Fuel (LNG)', nodriver: 'No driver', maint: 'Maintenance', other: 'Other' };
  const GKEY = { breakdown: 'brk', tyre: 'tyre', permit: 'permit', fuel: 'fuel', nodriver: 'nodrvSt', maint: 'maint', other: 'other' };
  const DOWN_GROUPS = ['breakdown', 'tyre', 'permit', 'fuel', 'nodriver', 'maint', 'other'];

  const ser = (arr, a, b) => { const o = []; for (let d = a; d <= b; d++) o.push(fin(arr[d]) ? arr[d] : null); return o; };
  const dates = (db, a, b) => db.dates.slice(a, b + 1);
  const shortDate = db => i => u.dS(db.dates[i]);
  function head(root, title, desc, extra) { root.appendChild(u.el(`<div class="ph"><div><h1>${esc(title)}</h1><p>${desc}</p></div><span class="sp"></span>${extra || ''}</div>`)); }
  function grid(root) { const g = u.el('<div class="grid"></div>'); root.appendChild(g); return g; }
  /** Adds a card to a grid; fn(host) fills it. */
  function card(g, span, title, sub, fn, acts) {
    const c = u.el(`<section class="card s${span}"><div class="ch"><h2>${esc(title)}</h2><span class="sub">${sub || ''}</span>${acts ? '<span class="acts"></span>' : ''}</div><div class="cb"></div></section>`);
    g.appendChild(c); const host = c.querySelector('.cb'); if (acts) acts(c.querySelector('.acts')); fn(host, c); return c;
  }
  const chartHost = (host, h) => { const d = u.el(`<div class="chart" style="min-height:${h || 120}px"></div>`); host.appendChild(d); return d; };
  const periodNote = C => u.dRange(C.db, C.a, C.b);
  const empty = (host, t) => host.appendChild(u.el(`<div class="empty">${esc(t)}</div>`));

  // ---- KPI table (Current | Previous | Change | Trend | Status) --------------------------------------------------------------------
  const GROUPS = { fleet: 'Fleet availability', work: 'Workforce', prod: 'Productivity (KM)' };
  function kpiTable(host, C, keys) {
    const list = C.kp.filter(k => !keys || keys.includes(k.def.k));
    const from = Math.max(C.db.firstStatus, C.b - 29);
    let h = `<div class="tw"><table class="kpi-t"><thead><tr><th>KPI</th><th class="n">Current</th><th class="n">Previous</th><th class="n">Change</th><th>Trend</th><th>Status</th></tr></thead><tbody>`;
    let grp = '';
    list.forEach(k => {
      if (k.def.grp !== grp) { grp = k.def.grp; h += `<tr class="grp"><td colspan="6">${GROUPS[grp]}</td></tr>`; }
      const sp = CH.spark(Array.from(k.series.subarray(from, C.b + 1)), { w: 90, h: 24 });
      h += `<tr><td>${esc(k.def.label)}${u.info(k.def.tip)}</td><td class="n"><b>${u.fmt(k.def, k.cur)}</b></td><td class="n" style="color:var(--ink-2)">${u.fmt(k.def, k.prev)}</td><td class="n dl ${k.state}" ${k.note ? 'data-tip="' + esc(k.note) + '"' : ''}>${u.deltaText(k)}</td><td>${sp}</td><td>${u.pill(k)}</td></tr>`;
    });
    h += `</tbody></table></div><p class="note">Current: ${esc(periodNote(C))}${C.pa >= 0 ? ' · Previous: ' + esc(u.dRange(C.db, C.pa, C.pb)) : ' · no earlier period with data'} · Trend: last 30 days with data. ↑ improving · ↓ worsening · → stable · ⚠ needs attention (worse than usual daily range, or below target).</p>`;
    host.innerHTML = h;
  }

  function tile(C, k, label, onclick) {
    const sp = CH.spark(Array.from(k.series.subarray(Math.max(C.db.firstStatus, C.b - 29), C.b + 1)), { w: 110, h: 24 });
    const b = u.el(`<button class="tile" data-tip="${esc(k.def.tip)}"><span class="lbl">${esc(label || k.def.label)}</span><span class="v">${k.def.fmt === 'km' ? u.int(k.cur) + ' <small style="font-size:14px;font-weight:500">km</small>' : u.fmt(k.def, k.cur)}</span><span class="d">${u.pill(k)}<span class="dl ${k.state}">${u.deltaText(k)}</span></span>${sp}</button>`);
    if (onclick) b.onclick = onclick; return b;
  }
  function road(C) {
    const a = C.K.avail, v = a.cur, S = C.S, p = fin(v) ? Math.max(0, Math.min(1, v)) : 0;
    const truck = `<svg class="truck" style="left:${(p * 100).toFixed(1)}%" viewBox="0 0 38 22" aria-hidden="true"><path d="M1 3h20v13H1z" fill="#f5b700"/><path d="M21 6h8l6 6v4H21z" fill="#e9f0ec"/><circle cx="8" cy="18" r="3.2" fill="#17201c" stroke="#e9f0ec" stroke-width="1.6"/><circle cx="28" cy="18" r="3.2" fill="#17201c" stroke="#e9f0ec" stroke-width="1.6"/></svg>`;
    return u.el(`<div class="road"><div class="lbl">Fleet availability · ${esc(periodNote(C))}</div><div class="big">${fin(v) ? (v * 100).toFixed(1) : '–'}<small>%</small></div><div class="cmp">${u.pill(a)}<span>${fin(a.prev) ? 'vs ' + u.pct(a.prev) + ' previous (' + u.deltaText(a) + ')' : 'no earlier period to compare'}</span></div><div class="lane" role="img" aria-label="Availability ${u.pct(v)}, target ${u.pct(S.availTarget, 0)}"><div class="fill" style="width:${(p * 100).toFixed(1)}%"></div><div class="dash"></div><div class="tgt" style="left:${(S.availTarget * 100).toFixed(1)}%" data-l="target ${(S.availTarget * 100).toFixed(0)}%"></div>${truck}</div><div class="cmp" style="margin-top:22px">${u.int(C.K.totalVeh.cur)} vehicles listed · ${u.int(C.K.activeVeh.cur)} working on ${esc(u.dL(C.db.dates[C.snap]))}</div></div>`);
  }

  // ---- per-client daily availability (for heat map / trend) -----------------------------------------------------------------
  function groupDaily(C, key, a, b) {
    const { db, DAY } = C, D = db.D, vm = DAY.vm, dm = DAY.dm, out = new Map();
    for (let v = 0; v < db.V; v++) {
      if (!vm[v]) continue; const g = db.vehicles[v][key] || '(none)'; let o = out.get(g); if (!o) out.set(g, o = { key: g, w: new Float64Array(b - a + 1), l: new Float64Array(b - a + 1), veh: 0 }); o.veh++;
      for (let d = a; d <= b; d++) { const s = db.vs[v * D + d]; if (s < 0) continue; if (dm) { const p = db.dA[v * D + d], q = db.dB[v * D + d]; if (!((p >= 0 && dm[p]) || (q >= 0 && dm[q]))) continue; } o.l[d - a]++; if (db.stGroup[s] === 'work') o.w[d - a]++; }
    }
    return [...out.values()];
  }
  function heatColor(v, C) { // availability colour scale relative to target
    if (!fin(v)) return 'var(--track)'; const t = C.S.availTarget; if (v >= t) return `color-mix(in srgb, var(--g-work) ${Math.round(45 + 55 * Math.min(1, (v - t) / (1 - t + 1e-9)))}%, var(--surface))`;
    const k = Math.min(1, (t - v) / 0.4); return `color-mix(in srgb, var(--g-breakdown) ${Math.round(18 + 80 * k)}%, var(--surface))`;
  }

  return { u, CH, K, esc, fin, GN, GKEY, DOWN_GROUPS, ser, dates, shortDate, head, grid, card, chartHost, periodNote, empty, kpiTable, tile, road, groupDaily, heatColor };
})();

function K_AGG(C) { return GL.calc.agg(C.DAY, C.db, C.a, C.b); }
function groupTable(host, C, rows, label, fkey) {

/* Driver Analytics + KM / Productivity */
GL.pg.events = function (C) {
  // joins / exits inside the period, restricted to the filtered fleet
  const { db, DAY, a, b } = C, D = db.D, vm = DAY.vm, dm = DAY.dm;
  const ok = (x, ref) => { const v = db.dvh[x * D + ref]; return v >= 0 && vm[v] && (!dm || dm[x]); };
  const exits = db.exits.filter(e => e.idx >= a && e.idx <= b && ok(e.x, e.idx - 1));
  const joins = db.joins.filter(e => e.idx >= a && e.idx <= b && ok(e.x, e.idx)), returns = db.returns.filter(e => e.idx >= a && e.idx <= b && ok(e.x, e.idx));
  return { exits, joins, returns };
};

        { k: 'util', h: 'Utilisation', n: 1, tip: 'KM by working vehicles ÷ (working vehicle-days × benchmark)', val: r => r.util, html: r => u.pct(r.util) }, { k: 'idle', h: 'Working but idle', n: 1, tip: 'Working vehicle-days with under ' + S.idleKm + ' km', val: r => r.idleWorkPct, html: r => u.pct(r.idleWorkPct) },

/* Breakdown & Downtime + Trend Analysis */
GL.pages.breakdown = function (C, root, A) {
  const P = GL.pg, u = P.u, CH = P.CH, K = GL.calc, db = C.db, esc = P.esc, S = C.S;
  P.head(root, 'Breakdown and downtime', `How long vehicles stay stopped, why, and which ones keep coming back. <b>${esc(P.periodNote(C))}</b>; ageing is measured on ${esc(u.dL(db.dates[C.snap]))}.`);
  const hero = u.el('<div class="hero" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"></div>'); root.appendChild(hero);
  ['notAvail', 'brk', 'tyre', 'stuck', 'brkPct', 'lostVD'].forEach(k => hero.appendChild(P.tile(C, C.K[k])));
  const g = P.grid(root), age = K.ageing(C.vst), lab = ['0–1 days', '2–3 days', '4–7 days', '8–14 days', '15+ days'];
  P.card(g, 6, 'Ageing of vehicles that are down today', 'Consecutive days not Working (any cause). Click a bar for the vehicles.', host => {
    const series = P.DOWN_GROUPS.map(gr => ({ name: P.GN[gr], color: u.gcol(gr), data: age.map(b => Object.entries(b.byGroup).reduce((s, [st, n]) => s + (db.stGroup[+st] === gr ? n : 0), 0)) })).filter(s => s.data.some(v => v > 0));
    if (!series.length) return P.empty(host, 'No vehicles are down on the latest day.');
    CH.cols(host.appendChild(u.el('<div class="chart"></div>')), { x: lab, series, h: 250, maxBar: 54, tipFmt: u.int, yFmt: u.int, label: 'Ageing buckets', onPick: i => ageDrawer(i) });
    host.insertAdjacentHTML('beforeend', `<p class="note">${u.int(age.reduce((s, b) => s + b.n, 0))} vehicles are down; <b>${u.int(age[3].n + age[4].n)}</b> have been down more than a week.</p>`);
  });

  const r = K.agg(C.DAY, db, C.a, C.b);
