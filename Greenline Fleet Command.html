/* ================================ TREND ANALYSIS ================================ */
GL.pages.trend = function (C, root, A) {
  const P = GL.pg, u = P.u, CH = P.CH, K = GL.calc, db = C.db, esc = P.esc, S = C.S, DAY = C.DAY;
  const TR = A.trend || (A.trend = { k: 'avail', g: 'day' });
  const kp = C.kp.find(x => x.def.k === TR.k) || C.kp.find(x => x.def.k === 'avail'), def = kp.def, first = db.firstStatus, last = C.snap;
  P.head(root, 'Trend analysis', `Is it getting better or worse, and how does now compare with before? Pick an indicator and a time grain. <b>${esc(P.periodNote(C))}</b>.`);
  const ctl = u.el('<div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><label for="trK" class="lab" style="font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)">Indicator</label><select class="sel" id="trK"></select><div class="seg" role="group" aria-label="Time grain"></div><span class="note" style="margin:0"></span></div>');
  const sel = ctl.querySelector('select'); C.kp.forEach(k => sel.appendChild(u.el(`<option value="${k.def.k}" ${k.def.k === def.k ? 'selected' : ''}>${esc(k.def.label)}</option>`)));
  sel.onchange = () => { TR.k = sel.value; GL.app.render(true); };
  [['day', 'Day'], ['week', 'Week'], ['month', 'Month']].forEach(([k, l]) => { const b = u.el(`<button aria-pressed="${TR.g === k}">${l}</button>`); b.onclick = () => { TR.g = k; GL.app.render(true); }; ctl.querySelector('.seg').appendChild(b); });
  ctl.querySelector('.note').innerHTML = esc(def.tip); root.appendChild(ctl);
  const S2 = C.S;
  const val = (x, y) => { // value of KPI over day range x..y
    if (def.snap) { const s = K.snapIdx(db, y); return s < x ? NaN : def.day(DAY, s, S2); }
    if (def.agg) { const r = K.agg(DAY, db, x, y), v = def.agg(r, S2); if (def.perDay) { const n = K.kmDays(db, x, y); return n ? v / n : NaN; } return v; }
    return K.mean(kp.series, x, y);
  };
  const hasData = d => db.statusHasData[d] || db.kmHas[d];
  function buckets(g) {
    const out = []; const iso = d => db.dates[d];
    if (g === 'day') { for (let d = first; d <= last; d++) if (hasData(d)) out.push({ a: d, b: d, label: u.dS(iso(d)), long: u.dL(iso(d)) }); return out; }
    let cur = null;
    for (let d = first; d <= last; d++) {
      const key = g === 'month' ? iso(d).slice(0, 7) : (() => { const dw = (new Date(iso(d) + 'T00:00:00Z').getUTCDay() + 6) % 7; return String(d - dw); })();
      if (!cur || cur.key !== key) { cur = { key, a: d, b: d, label: g === 'month' ? u.MON[+iso(d).slice(5, 7) - 1] + ' ' + iso(d).slice(2, 4) : 'w/c ' + u.dS(iso(d)) }; out.push(cur); } cur.b = d;
    }
    out.forEach(b => { b.n = b.b - b.a + 1; b.long = b.label + ' (' + u.dS(iso(b.a)) + ' – ' + u.dS(iso(b.b)) + ')'; }); return out;
  }
  const g = P.grid(root);
  const additive = ['lostVD', 'km', 'exits', 'joiners'].includes(def.k);
  const fmtv = v => u.fmt(def, v), yf = /pct/.test(def.fmt) ? (v => (v * 100).toFixed(def.fmt === 'pctSigned' ? 1 : 0) + '%') : (def.fmt === 'dec2' ? (v => v.toFixed(2)) : u.int);
  const bk = buckets(TR.g);
  if (TR.g === 'day') {
    // current vs previous (aligned) vs historical average
    const cur = [], prev = [], n = C.b - C.a + 1;
    for (let i = 0; i < n; i++) { cur.push(fin(kp.series[C.a + i])); prev.push(C.pa >= 0 ? fin(kp.series[C.pa + i]) : null); }
    // historical average: every day with data before this period (falls back to all days)
    let hs = 0, hn = 0; for (let d = first; d < C.a; d++) { const v = kp.series[d]; if (isFinite(v)) { hs += v; hn++; } }
    if (!hn) for (let d = first; d <= last; d++) { const v = kp.series[d]; if (isFinite(v)) { hs += v; hn++; } }
    const hist = hn ? hs / hn : NaN, histLbl = (hist === hist ? 'avg ' + fmtv(hist) : ''), histNote = C.a > first ? 'average of all earlier days' : 'average of all days (no earlier history)';
    P.card(g, 8, def.label + ': current vs previous', `Current = ${esc(P.periodNote(C))}${C.pa >= 0 ? ', previous = ' + esc(u.dRange(db, C.pa, C.pb)) + ' (day by day)' : ' (no previous period with data)'}; dotted line = historical ${histNote}`, host => {
      const series = [{ name: 'Current', color: 'var(--c1)', data: cur, area: true }]; if (C.pa >= 0) series.push({ name: 'Previous', color: 'var(--c-prev)', data: prev, dash: '5 4', noDot: true });
      CH.line(host.appendChild(u.el('<div class="chart"></div>')), { x: db.dates.slice(C.a, C.b + 1), xFmt: i => u.dS(db.dates[C.a + i]), tipTitle: i => u.dL(db.dates[C.a + i]) + (C.pa >= 0 ? ' vs ' + u.dL(db.dates[C.pa + i]) : ''), h: 260, yFmt: yf, tipFmt: fmtv, yWidth: 54, series, refs: hist === hist ? [{ y: hist, label: histLbl, color: 'var(--g-tyre)' }] : [], label: def.label + ' trend' });
    });
    // cumulative
    P.card(g, 4, additive ? 'Cumulative ' + def.label.toLowerCase() : 'Running average', additive ? 'Running total since the start of the period' : 'Average of the days so far', host => {
      const run = a0 => { const o = []; let s = 0, c = 0; for (let i = 0; i < n; i++) { const v = kp.series[a0 + i]; if (isFinite(v)) { s += v; c++; } o.push(c ? (additive ? s : s / c) : null); } return o; };
      const series = [{ name: 'Current', color: 'var(--c1)', data: run(C.a) }]; if (C.pa >= 0) series.push({ name: 'Previous', color: 'var(--c-prev)', data: run(C.pa), dash: '5 4', noDot: true });
      CH.line(host.appendChild(u.el('<div class="chart"></div>')), { x: db.dates.slice(C.a, C.b + 1), xFmt: i => u.dS(db.dates[C.a + i]), tipTitle: i => 'Day ' + (i + 1) + ' · ' + u.dL(db.dates[C.a + i]), h: 260, yFmt: yf, tipFmt: v => additive ? u.int(v) : fmtv(v), yWidth: 54, series, label: 'Cumulative' });
    });
    // best / worst days
    const days = []; for (let d = C.a; d <= C.b; d++) if (isFinite(kp.series[d])) days.push({ d, v: kp.series[d] });
    const better = def.good >= 0 ? (x, y) => y.v - x.v : (x, y) => x.v - y.v;
    const dayRows = (list, title) => P.card(g, 6, title, '', host => u.table(host, { rows: list, copy: false, cols: [{ k: 'd', h: 'Date', val: r => r.d, html: r => esc(u.dow(db.dates[r.d]) + ' ' + u.dL(db.dates[r.d])) }, { k: 'v', h: def.label, n: 1, val: r => r.v, html: r => '<b>' + fmtv(r.v) + '</b>' }, { k: 'x', h: 'vs historical average', n: 1, html: r => isFinite(hist) ? '<span class="dl ' + ((r.v - hist) * (def.good || 0) > 0 ? 'better' : (r.v - hist) * (def.good || 0) < 0 ? 'worse' : 'stable') + '">' + (/pct/.test(def.fmt) ? u.signed((r.v - hist) * 100, v => v.toFixed(1)) + ' pp' : u.signed(r.v - hist, v => def.fmt === 'dec2' ? v.toFixed(2) : u.int(v))) + '</span>' : '–', txt: r => isFinite(hist) ? r.v - hist : '' }] }));
    if (days.length >= 2) { dayRows(days.slice().sort(better).slice(0, 5), def.good === 0 ? 'Highest 5 days' : 'Best 5 days'); dayRows(days.slice().sort((x, y) => -better(x, y)).slice(0, 5), def.good === 0 ? 'Lowest 5 days' : 'Worst 5 days'); }
  } else {
    // week / month over the whole data range
    const vals = bk.map(b => val(b.a, b.b)), fin2 = vals.filter(isFinite), hist = fin2.length ? fin2.reduce((s, x) => s + x, 0) / fin2.length : NaN;
    const shade = [bk.findIndex(b => b.b >= C.a), bk.length - 1 - [...bk].reverse().findIndex(b => b.a <= C.b)];
    P.card(g, 8, def.label + ' by ' + TR.g, 'Every ' + TR.g + ' in the data; shaded = selected period; dotted line = average of all ' + TR.g + 's', host => {
      const mk = host.appendChild(u.el('<div class="chart"></div>'));
      if (bk.length < 2) return P.empty(host, 'Only one ' + TR.g + ' of data so far.');
      CH.line(mk, { x: bk.map(b => b.label), tipTitle: i => bk[i].long, h: 260, yFmt: yf, tipFmt: fmtv, yWidth: 54, series: [{ name: def.label, color: 'var(--c1)', data: vals.map(v => isFinite(v) ? v : null), area: true }], refs: isFinite(hist) ? [{ y: hist, label: 'avg ' + fmtv(hist), color: 'var(--g-tyre)' }] : [], shade: shade[0] >= 0 && shade[1] >= 0 ? [[shade[0], shade[1]]] : [], label: def.label + ' by ' + TR.g });
      host.insertAdjacentHTML('beforeend', '<p class="note">The first and last ' + TR.g + ' may cover fewer days than a full ' + TR.g + '. Total KM is shown per day with KM data so partial ' + TR.g + 's compare fairly.</p>');
    });
    P.card(g, 4, 'Cumulative ' + (additive ? def.label.toLowerCase() : 'average'), 'Across all ' + TR.g + 's', host => {
      let s = 0, c = 0; const run = vals.map(v => { if (isFinite(v)) { s += additive && def.perDay ? v : v; c++; } return c ? (additive ? s : s / c) : null; });
      if (bk.length < 2) return P.empty(host, 'Needs at least two ' + TR.g + 's.');
      CH.line(host.appendChild(u.el('<div class="chart"></div>')), { x: bk.map(b => b.label), tipTitle: i => bk[i].long, h: 260, yFmt: yf, tipFmt: v => additive ? u.int(v) : fmtv(v), yWidth: 54, series: [{ name: additive ? 'Running total' : 'Running average', color: 'var(--c1)', data: run }], label: 'Cumulative' });
    });
    P.card(g, 12, 'Change from one ' + TR.g + ' to the next', '', host => {
      const rows = bk.map((b, i) => ({ b, v: vals[i], p: i ? vals[i - 1] : NaN }));
      u.table(host, { rows, copy: true, pageSize: 20, cols: [{ k: 'b', h: TR.g === 'week' ? 'Week' : 'Month', val: r => r.b.a, html: r => esc(r.b.long) }, { k: 'v', h: def.label, n: 1, val: r => r.v, html: r => '<b>' + fmtv(r.v) + '</b>' }, { k: 'd', h: 'Change', n: 1, val: r => r.v - r.p, html: r => { if (!isFinite(r.p) || !isFinite(r.v)) return '–'; const dlt = r.v - r.p, c = def.good === 0 ? 'stable' : dlt * def.good > 0 ? 'better' : dlt * def.good < 0 ? 'worse' : 'stable'; return '<span class="dl ' + c + '">' + (/pct/.test(def.fmt) ? u.signed(dlt * 100, v => v.toFixed(1)) + ' pp' : u.signed(dlt, v => def.fmt === 'dec2' ? v.toFixed(2) : u.int(v))) + '</span>'; } }] });
    });
  }
  // weekday pattern
  P.card(g, 6, 'Typical day of the week', 'Average of ' + def.label.toLowerCase() + ' on each weekday, all days with data', host => {
    const s = new Array(7).fill(0), n = new Array(7).fill(0);
    for (let d = first; d <= last; d++) { const v = kp.series[d]; if (!isFinite(v)) continue; const w = new Date(db.dates[d] + 'T00:00:00Z').getUTCDay(); s[w] += v; n[w]++; }
    const order = [1, 2, 3, 4, 5, 6, 0], vals = order.map(w => n[w] ? s[w] / n[w] : null);
    if (n.filter(x => x > 0).length < 5) return P.empty(host, 'Needs at least a week of data.');
    CH.line(host.appendChild(u.el('<div class="chart"></div>')), { x: order.map(w => u.DOW[w]), h: 210, yFmt: yf, tipFmt: fmtv, yWidth: 54, series: [{ name: def.label, color: 'var(--c1)', data: vals, area: false }], label: 'Weekday pattern', tipTitle: i => u.DOW[order[i]] + ' · average of ' + n[order[i]] + ' days' });
  });
  P.card(g, 6, 'All indicators, whole data range', 'Small multiples; click to select', host => {
    const wrap = u.el('<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px"></div>'); host.appendChild(wrap);
    ['avail', 'brk', 'tyre', 'stuck', 'noDrv', 'drivers', 'exits', 'attr', 'kmVeh', 'util', 'idleWork', 'fuelVar'].forEach(k => { const x = C.kp.find(y => y.def.k === k); const t = u.el(`<button class="tile" style="box-shadow:none;padding:8px 10px"><span class="lbl">${esc(x.def.label)}</span><span class="v" style="font-size:22px">${u.fmt(x.def, x.cur)}</span>${CH.spark(Array.from(x.series.subarray(first, last + 1)), { w: 130, h: 26 })}</button>`); t.onclick = () => { TR.k = k; GL.app.render(true); }; wrap.appendChild(t); });
  });
  function fin(x) { return isFinite(x) ? x : null; }
};

      const b = u.el('<button class="btn pri" style="align-self:flex-start">Open records in Data Explorer</button>'); const pv = r && r.primary >= 0 ? r.primary : (rows[0] ? rows[0].v : null);

  // ================================ MANAGEMENT ATTENTION ================================
  GL.pages.action = function (C, root, A) {
    const db = C.db, S = C.S, SEV = K.SEV;
    P.head(root, 'Management attention', `What to act on first. Each item is ranked by <b>business impact × how actionable it is × how reliable the data behind it is</b>. <b>${esc(P.periodNote(C))}</b>.`);
    const real = C.issues.filter(i => i.sev > 0), info = C.issues.filter(i => i.sev === 0);
    const cnt = [3, 2, 1].map(s => [s, real.filter(i => i.sev === s).length]);
    const g = P.grid(root);
    P.card(g, 8, 'Ranked actions', 'by severity, then priority · ' + cnt.map(([s, n]) => n + ' ' + SEV[s].toLowerCase()).join(' · '), host => {
      if (!real.length) return P.empty(host, 'No issues stand out. Availability and productivity are within their normal range.');
      real.forEach((i, k) => {
        const el = u.el(`<div class="issue"><div class="rk">${k + 1}</div><div><div class="meta"><span class="sev s${i.sev}">${SEV[i.sev]}</span>${i.trend === 'worse' ? '<span class="st worse"><i>↓</i>Getting worse</span>' : i.trend === 'better' ? '<span class="st better"><i>↑</i>Improving</span>' : '<span class="st stable"><i>→</i>Steady</span>'}</div><h3>${esc(i.title)}</h3><p>${esc(i.detail)}</p>${i.impactText ? '<p><b>Size:</b> ' + esc(i.impactText) + '</p>' : ''}<p class="act"><b>Next step:</b> ${esc(i.action)}</p><div class="score" data-tip="Priority = impact (vehicle-days) × actionability (how directly management can fix it) × data reliability (share of the period with the needed data).">Priority ${u.int(i.score)} = impact ${u.int(i.impactEff)} × actionability ${i.act} × reliability ${i.rel.toFixed(2)}</div></div><div class="side"></div></div>`);
        const side = el.querySelector('.side');
        const list = i.list || (i.filterStatus != null ? C.vst.filter(r => r.cur === i.filterStatus).map(r => r.v) : null);
        if (list && list.length) { const b = u.el('<button class="btn sm pri">See ' + list.length + ' vehicles</button>'); b.onclick = () => u.openDrawer(i.listTitle || i.title, list.length + ' vehicles', body => P.vehicleTable(body, C, list.map(v => C.vst.find(r => r.v === v)).filter(Boolean), { pageSize: 30 })); side.appendChild(b); }
        if (i.drvList && i.drvList.length) { const b = u.el('<button class="btn sm pri">See ' + i.drvList.length + ' drivers</button>'); b.onclick = () => u.openDrawer(i.title, i.drvList.length + ' drivers', body => P.driverTable(body, C, C.drv.filter(d => i.drvList.includes(d.x)), { pageSize: 30 })); side.appendChild(b); }
        const route = { stuck: ['breakdown'], avail: ['breakdown'], availlow: ['breakdown'], cause: ['breakdown'], repeat: ['breakdown'], site: ['explorer', { client: i.site || null, veh: null, drv: null }], nodrv: ['drivers'], attr: ['drivers'], under: ['km'], idlework: ['km'], fuel: ['km'], kmgap: ['quality'] }[i.id];
        if (route) { const b = u.el('<button class="btn sm">Open page</button>'); b.onclick = () => A.go(route[0], route[1]); side.appendChild(b); }
        host.appendChild(el);
      });
      if (info.length) host.insertAdjacentHTML('beforeend', '<h3 style="font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 4px">Data notes</h3>' + info.map(i => `<div class="good-i"><span class="ck" style="color:var(--neutral)">i</span><div><b>${esc(i.title)}</b><span>${esc(i.detail)} ${esc(i.action)}</span></div></div>`).join(''));
    });
    const col = u.el('<div class="s4" style="display:flex;flex-direction:column;gap:14px;min-width:0"></div>'); g.appendChild(col);
    const sub = P.grid(col); sub.style.display = 'flex'; sub.style.flexDirection = 'column';
    P.card(sub, 12, 'What is going well', 'Keep doing this', host => { if (!C.good.length) return P.empty(host, 'No clear improvements against the previous period.'); C.good.forEach(x => host.appendChild(u.el(`<div class="good-i"><span class="ck">✓</span><div><b>${esc(x.title)}</b><span>${esc(x.detail)}</span></div></div>`))); });
    P.card(sub, 12, 'How the ranking works', '', host => host.innerHTML = `<ul class="method"><li><b>Impact</b>: vehicle-days lost or at risk in the period${S.revenue > 0 ? ', shown in rupees at ₹' + u.int(S.revenue) + ' per vehicle-day' : ''}. Where no vehicle-day size exists (such as driver exits) a middling value is used.</li><li><b>Actionability</b>: 0.9 for stuck vehicles and driver matching, 0.7 for causes, sites and repeats, 0.5–0.6 for broader performance gaps.</li><li><b>Reliability</b>: lower when the issue relies on KM data that covers only part of the period.</li><li><b>Order</b>: items are grouped by severity (Critical, High, Medium), then ranked by the priority score within each group. Severity reflects size relative to the fleet and direction of travel.</li></ul>`);
    P.card(g, 12, 'Escalation list: longest-stopped vehicles', 'Vehicles not Working for ' + S.stuckDays + '+ days, oldest first', host => {
      const st = C.vst.filter(r => r.cur >= 0 && db.stGroup[r.cur] !== 'work' && r.age >= S.stuckDays).sort((x, y) => y.age - x.age);
      if (!st.length) return P.empty(host, 'Nothing has been stopped for ' + S.stuckDays + ' days or more.');
      P.vehicleTable(host, C, st, { pageSize: 15, cols: ['id', 'client', 'sup', 'status', 'age', 'since', 'driver'], sort: { k: 'age', dir: -1 } });
    });
  };

  // ================================ DATA EXPLORER ================================
  GL.pages.explorer = function (C, root, A) {
    const db = C.db, D = db.D, ex = A.ex, S = C.S;
    const set = o => { Object.assign(A.ex, o); GL.app.render(true); };
    if (ex.veh != null && (ex.veh < 0 || ex.veh >= db.V)) ex.veh = null;
    P.head(root, 'Data explorer', 'Start at the whole company and drill down: client or site, then vehicle, then driver, then the daily records. Active filters apply.');
    const cl = ex.client != null ? ex.client : null, veh = ex.veh, dr = ex.drv;
    const cr = u.el('<div class="card crumbs"></div>'); root.appendChild(cr);
    const addC = (label, fn, cur) => { if (cr.children.length) cr.appendChild(u.el('<span aria-hidden="true">›</span>')); const e = cur ? u.el(`<span class="cur">${esc(label)}</span>`) : u.el(`<a tabindex="0">${esc(label)}</a>`); if (!cur) { e.onclick = fn; e.onkeydown = ev => { if (ev.key === 'Enter') fn(); }; } cr.appendChild(e); };
    addC('Company', () => set({ client: null, veh: null, drv: null }), cl == null && veh == null && dr == null);
    if (cl != null) addC(cl || '(no client)', () => set({ veh: null, drv: null }), veh == null && dr == null);
    if (veh != null) addC(db.vehicles[veh].id, () => set({ drv: null }), dr == null);
    if (dr != null) addC(db.drivers[dr].name || db.drivers[dr].code, () => { }, true);
    const g = P.grid(root);
    if (dr != null && veh != null) { // records
      const rows = []; for (let d = C.a; d <= C.b; d++) { if (!db.dp[dr * D + d] || db.dvh[dr * D + d] !== veh) continue; const k = veh * D + d, s = db.vs[k], n = db.nd[k], km = db.km[k]; rows.push({ d, s, n, km, share: isNaN(km) || n <= 0 ? NaN : km / n, fuel: db.fuelAct[k] }); }
      P.card(g, 12, 'Daily records', `${esc(db.drivers[dr].name || db.drivers[dr].code)} on ${esc(db.vehicles[veh].id)}, ${esc(P.periodNote(C))}`, host => u.table(host, { rows, pageSize: 31, empty: 'This driver was not on this vehicle in the period.', sort: { k: 'd', dir: 1 },
        cols: [{ k: 'd', h: 'Date', val: r => r.d, html: r => esc(u.dow(db.dates[r.d]) + ' ' + u.dL(db.dates[r.d])), txt: r => db.dates[r.d] }, { k: 's', h: 'Vehicle status', val: r => r.s >= 0 ? db.statuses[r.s] : '', html: r => u.statusPill(db, r.s) }, { k: 'n', h: 'Drivers on vehicle', n: 1, val: r => r.n, html: r => r.n }, { k: 'km', h: 'Vehicle KM', n: 1, val: r => r.km, html: r => u.int(r.km) }, { k: 'sh', h: 'Driver’s share of KM', n: 1, val: r => r.share, html: r => u.int(r.share) }, { k: 'f', h: 'Fuel expense (₹)', n: 1, val: r => r.fuel, html: r => u.int(r.fuel) }] }));
      return;
    }
    if (veh != null) {
      const r = C.vst.find(q => q.v === veh);
      const b = u.el('<button class="btn pri" style="align-self:flex-start">Open the full vehicle history</button>'); b.onclick = () => P.vehicleDrawer(C, veh);
      P.card(g, 12, db.vehicles[veh].id, [db.vehicles[veh].client, db.vehicles[veh].vtype, db.vehicles[veh].sup].filter(Boolean).join(' · '), host => {
        if (r) host.appendChild(u.el(`<div class="kv"><div><small>Status now</small><b style="font-size:15px">${r.cur >= 0 ? esc(db.statuses[r.cur]) : '–'}</b></div><div><small>Availability</small><b>${u.pct(r.avail, 0)}</b></div><div><small>Lost days</small><b>${r.down}</b></div><div><small>Avg KM working</small><b>${u.int(r.avgKmWork)}</b></div><div><small>Breakdowns</small><b>${r.brkEps}</b></div></div>`));
        host.appendChild(b);
      });
      const cnt = new Map(); for (let d = C.a; d <= C.b; d++) { const k = veh * D + d, n = db.nd[k], km = db.km[k]; [db.dA[k], db.dB[k]].forEach(i => { if (i < 0) return; let o = cnt.get(i); if (!o) cnt.set(i, o = { i, n: 0, km: 0 }); o.n++; if (!isNaN(km) && n > 0) o.km += km / n; }); }
      const rows = [...cnt.values()].map(o => Object.assign(o, { d: db.drivers[o.i] }));
      P.card(g, 12, 'Drivers on this vehicle', 'Click a driver to see the daily records', host => u.table(host, { rows, pageSize: 20, sort: { k: 'n', dir: -1 }, onRow: o => set({ drv: o.i }), empty: 'No driver named on this vehicle in the period.', cols: [{ k: 'n', h: 'Driver', val: o => o.d.name, html: o => '<b>' + esc(o.d.name || o.d.code) + '</b>' }, { k: 'c', h: 'Code', val: o => o.d.code, html: o => '<span class="k">' + esc(o.d.code) + '</span>' }, { k: 'v', h: 'Vendor', val: o => o.d.vendor, html: o => esc(o.d.vendor) }, { k: 'dd', h: 'Days', n: 1, val: o => o.n, html: o => o.n }, { k: 'km', h: 'KM share', n: 1, val: o => o.km, html: o => u.int(o.km) }] }));
      return;
    }
    if (cl != null) {
      const rows = C.vst.filter(r => (r.client || '') === cl), gs = C.gc.find(x => x.key === (cl || '(no client)'));
      P.card(g, 12, cl || '(no client)', gs ? gs.veh + ' vehicles in the filtered fleet' : 'No vehicles match the current filters', host => {
        if (gs) host.appendChild(u.el(`<div class="kv"><div><small>Availability</small><b>${u.pct(gs.avail)}</b></div><div><small>Lost days</small><b>${u.int(gs.down)}</b></div><div><small>Breakdown days</small><b>${u.int(gs.brk)}</b></div><div><small>Stuck now</small><b>${gs.stuck}</b></div><div><small>KM / vehicle / day</small><b>${u.int(gs.kmVeh)}</b></div><div><small>Utilisation</small><b>${u.pct(gs.util, 0)}</b></div></div>`));
      });
      P.card(g, 12, 'Vehicles', 'Click a vehicle to drill down', host => P.vehicleTable(host, C, rows, { pageSize: 25, onRow: r => set({ veh: r.v, drv: null }), sort: { k: 'down', dir: -1 } }));
      return;
    }
    P.card(g, 12, 'Clients and sites', 'Click a row to drill into it', host => u.table(host, { rows: C.gc, pageSize: 20, search: r => r.key, sort: { k: 'down', dir: -1 }, onRow: r => set({ client: r.key === '(no client)' ? '' : r.key, veh: null, drv: null }),
      cols: [{ k: 'key', h: 'Client / site', val: r => r.key, html: r => '<b>' + esc(r.key) + '</b>' }, { k: 'veh', h: 'Vehicles', n: 1, val: r => r.veh, html: r => u.int(r.veh) }, { k: 'avail', h: 'Availability', n: 1, val: r => r.avail, html: r => u.pct(r.avail) }, { k: 'down', h: 'Lost days', n: 1, val: r => r.down, html: r => u.int(r.down) }, { k: 'brk', h: 'Breakdown days', n: 1, val: r => r.brk, html: r => u.int(r.brk) }, { k: 'stuck', h: 'Stuck now', n: 1, val: r => r.stuck, html: r => u.int(r.stuck) }, { k: 'km', h: 'KM / vehicle / day', n: 1, val: r => r.kmVeh, html: r => u.int(r.kmVeh) }, { k: 'util', h: 'Utilisation', n: 1, val: r => r.util, html: r => u.pct(r.util, 0) }] }));
  };

  // ================================ DATA QUALITY ================================
  GL.pages.quality = function (C, root, A) {
    const db = C.db, D = db.D;
    P.head(root, 'Data quality', 'Everything unusual found in the files, how it is handled and how far the three sources agree. Nothing is silently dropped: each item below is counted and, where useful, listed.');
    let sDays = 0, kDays = 0; for (let d = db.firstStatus; d <= C.snap; d++) { if (db.statusHasData[d]) sDays++; if (db.kmHas[d]) kDays++; }
    const lv = { error: 0, warn: 0, info: 0 }; db.dq.forEach(x => lv[x.level] = (lv[x.level] || 0) + 1);
    const vIn = db.vehicles.filter(v => v.inFleet).length, vKm = db.vehicles.filter(v => v.hasKm).length;
    const hero = u.el(`<div class="hero" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><div class="tile"><span class="lbl">Files loaded</span><span class="v">${A.state.parsed.length}</span></div><div class="tile"><span class="lbl">Days with status</span><span class="v">${sDays}</span><span class="d">${esc(u.dS(db.dates[db.firstStatus]))} → ${esc(u.dS(db.dates[C.snap]))}</span></div><div class="tile"><span class="lbl">Days with KM</span><span class="v">${kDays}</span></div><div class="tile"><span class="lbl">Vehicles / with KM</span><span class="v" style="font-size:24px">${u.int(vIn)} / ${u.int(vKm)}</span></div><div class="tile"><span class="lbl">Drivers tracked</span><span class="v">${u.int(db.Dr)}</span></div><div class="tile"><span class="lbl">Findings</span><span class="v">${lv.error + lv.warn + lv.info}</span><span class="d"><span class="st attention"><i>✕</i>${lv.error}</span><span class="st worse" style="background:var(--warn-bg);color:var(--warn)"><i>!</i>${lv.warn}</span><span class="st stable"><i>i</i>${lv.info}</span></span></div></div>`); root.appendChild(hero);
    const g = P.grid(root);
    P.card(g, 7, 'Findings', 'Most serious first', host => {
      const order = { error: 0, warn: 1, info: 2 }, ico = { error: '✕', warn: '!', info: 'i' };
      const list = db.dq.slice().sort((x, y) => order[x.level] - order[y.level] || y.count - x.count);
      if (!list.length) return P.empty(host, 'No data-quality findings.');
      list.forEach(x => host.appendChild(u.el(`<div class="dq-i ${x.level}"><span class="ic">${ico[x.level]}</span><div><b>${esc(x.title)}</b>${x.detail ? '<small>' + esc(x.detail) + '</small>' : ''}${x.examples && x.examples.length ? '<small class="k">e.g. ' + esc(x.examples.join(', ')) + '</small>' : ''}${x.file ? '<small>File: ' + esc(x.file) + '</small>' : ''}</div><span class="cn">${u.int(x.count)}</span></div>`)));
    });
    const col = u.el('<div class="s5" style="display:flex;flex-direction:column;gap:14px;min-width:0"></div>'); g.appendChild(col); const sub = P.grid(col); sub.style.display = 'flex'; sub.style.flexDirection = 'column';
    P.card(sub, 12, 'Do the sources agree?', '', host => {
      const r = db.recon || {}, rows = [];
      if (r.agree != null) rows.push([r.disagree ? 'warn' : 'ok', `Fleet file vs DU day sheets: ${u.int(r.agree)} vehicle-days agree, ${u.int(r.disagree || 0)} differ, ${u.int(r.missing || 0)} only in one source.`]);
      if (r.attr) rows.push([r.attr.listed === r.attr.matched && r.attr.derived === r.attr.matched ? 'ok' : 'warn', `Driver exits: the Driverwise list names ${r.attr.listed}, daily presence derives ${r.attr.derived}, ${r.attr.matched} appear in both.`]);
      rows.push([db.lastKm >= C.snap ? 'ok' : 'warn', db.lastKm >= C.snap ? 'KM data covers every status day.' : 'KM data ends ' + u.dL(db.dates[db.lastKm]) + ', status runs to ' + u.dL(db.dates[C.snap]) + '.']);
      rows.push([db.copiedDays.length ? 'warn' : 'ok', db.copiedDays.length ? 'Copied day(s): ' + db.copiedDays.map(u.dL).join(', ') + (db.opts.dropCopied ? ' (ignored in all KPIs)' : ' (included)') : 'No copied days found.']);
      host.innerHTML = rows.map(([s, t]) => `<div class="good-i"><span class="ck" style="color:var(--${s === 'ok' ? 'good' : 'warn'})">${s === 'ok' ? '✓' : '!'}</span><div><span style="color:var(--ink)">${esc(t)}</span></div></div>`).join('');
    });
    P.card(sub, 12, 'Files', '', host => u.table(host, { rows: db.sources, copy: false, pageSize: 10, cols: [{ k: 'n', h: 'File', val: r => r.name, html: r => '<b style="word-break:break-all">' + esc(r.name) + '</b>' }, { k: 'k', h: 'Contains', html: r => esc((r.kinds || []).map(k => ({ DU: 'DU daily sheets', DRV: 'KM & movement', FLT: 'Fleet snapshot' }[k] || k)).join(' + ')) }, { k: 'r', h: 'Dates', html: r => esc((r.range ? u.dS(r.range[0]) + ' → ' + u.dS(r.range[1]) : '') + (r.kmRange ? ' KM ' + u.dS(r.kmRange[0]) + ' → ' + u.dS(r.kmRange[1]) : '')) }] }));
    P.card(g, 12, 'Daily coverage', 'One cell per day: green = status and KM, amber = status only, red = copied day, grey = nothing', host => {
      const cp = new Set(db.copiedDays), cells = []; for (let d = 0; d < D; d++) { const s = db.statusHasData[d], k = db.kmHas[d], c = cp.has(db.dates[d]); cells.push({ color: c ? 'var(--g-breakdown)' : s && k ? 'var(--g-work)' : s ? 'var(--g-tyre)' : k ? 'var(--g-fuel)' : 'var(--track)', title: u.dow(db.dates[d]) + ' ' + u.dL(db.dates[d]), rows: [{ value: c ? 'Copy of previous day (ignored)' : s ? 'Status data' : 'No status data' }, { value: k ? 'KM data' : 'No KM data', name: '' }] }); }
      CH.strip(host.appendChild(u.el('<div class="chart"></div>')), { cells, axis: i => u.dS(db.dates[i]), h: 26, label: 'Daily coverage' });
    });
    P.card(g, 12, 'Definitions and assumptions', 'Read these before comparing numbers with other reports', host => host.innerHTML = `<ul class="method">
      <li><b>Availability</b> = vehicle-days with status Working ÷ vehicle-days listed. Vehicles with no driver are counted by their recorded status. The Fleet file’s own availability excludes driverless vehicles, so it reads higher.</li>
      <li><b>Previous period</b> = the same number of days immediately before the selected period. If there is no earlier data, comparisons show “no comparison”.</li>
      <li><b>KM</b> comes from the Driverwise odometer grid. It is per vehicle. Per-driver KM splits a vehicle’s KM equally between the drivers named on it that day, so driver KM is not comparable with the ${C.S.bench} km vehicle benchmark.</li>
      <li><b>Utilisation</b> = KM by Working vehicles ÷ (working vehicle-days × ${C.S.bench} km). Vehicles in the KM grid but not in a status sheet (${u.int(vKm - db.vehicles.filter(v => v.inFleet && v.hasKm).length)}) are excluded from fleet KPIs.</li>
      <li><b>Driver exit</b> = a driver not named on any vehicle for more than ${db.opts.grace} days after last appearing, dated on the first absent day. <b>Joiner</b> = first appearance after the window starts, or a return after such an absence.</li>
      <li><b>Stuck</b> = not Working for ${C.S.stuckDays}+ consecutive days (any cause). A breakdown that switches between “Breakdown – BEM” and “Breakdown – Greenline” counts as one breakdown.</li>
      <li><b>Rupee figures</b> use ₹${u.int(C.S.revenue)} per vehicle-day${db.cfg && db.cfg.revenuePerDay ? ' from the Fleet file settings' : ''}. They are an order-of-magnitude guide, not accounts.</li>
      <li><b>Privacy</b>: mobile numbers, Aadhaar and UAN columns are not read. Files stay in your browser.</li></ul>`);
  };
})();
